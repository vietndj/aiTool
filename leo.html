<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leo 2.1 — Kiến trúc sư Sales Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0d0d; --surface:#181818; --s2:#222; --border:#2c2c2c;
      --text:#e8e8e8; --muted:#777; --dim:#999;
      --a:#f59e0b; --a-dim:rgba(245,158,11,.12); --a-glow:rgba(245,158,11,.25);
      --ubg:#1c2235; --uborder:#283047;
      --g:#22c55e; --g-dim:rgba(34,197,94,.1);
    }
    html,body{height:100%}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
      display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ── HEADER ── */
    header{display:flex;align-items:center;justify-content:space-between;
      padding:13px 20px;background:var(--surface);border-bottom:1px solid var(--border);
      flex-shrink:0;z-index:50}
    .hl{display:flex;align-items:center;gap:12px}
    .av-w{position:relative;width:38px;height:38px}
    .av{width:38px;height:38px;border-radius:11px;
      background:linear-gradient(135deg,#f59e0b,#ea580c);
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:800;color:#0d0d0d;position:relative;z-index:2;
      box-shadow:0 0 14px rgba(245,158,11,.2)}
    .av-ring{position:absolute;inset:-4px;border-radius:14px;
      border:2px solid var(--a);opacity:0;transition:opacity .3s}
    .av-ring.on{opacity:1;animation:rp 1.6s ease-in-out infinite}
    @keyframes rp{0%,100%{box-shadow:0 0 0 0 var(--a-glow)}50%{box-shadow:0 0 0 7px transparent}}
    .hd-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
    .badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;
      background:var(--a-dim);color:var(--a);border:1px solid rgba(245,158,11,.25);
      letter-spacing:.5px;text-transform:uppercase}
    .hd-sub{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:2px}
    .dot-live{width:6px;height:6px;border-radius:50%;background:var(--g);
      animation:blink 2.2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    /* Mode badge */
    .mode-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;
      border:1px solid var(--border);background:var(--s2);
      font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
    .mode-badge.on{border-color:rgba(34,197,94,.3);background:var(--g-dim);color:var(--g)}
    .mode-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .mode-badge.on .mode-dot{background:var(--g)}
    .hr{display:flex;align-items:center;gap:8px}
    .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
      background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;
      cursor:pointer;font-size:13px;transition:all .2s}
    .icon-btn:hover{background:var(--s2);color:var(--text)}

    /* ── PROGRESS ── */
    .pt{height:2px;background:var(--border);flex-shrink:0}
    .pf{height:100%;background:linear-gradient(90deg,var(--a),#ea580c);
      width:0%;transition:width .6s cubic-bezier(.4,0,.2,1)}

    /* ── CHAT ── */
    #chat{flex:1;overflow-y:auto;padding:28px 16px 0;scroll-behavior:smooth}
    #chat::-webkit-scrollbar{width:4px}
    #chat::-webkit-scrollbar-thumb{background:#333;border-radius:999px}
    .cw{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:20px}
    .msg{display:flex;gap:10px;animation:rise .28s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{flex-direction:row-reverse}
    .mav{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
      justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
    .mav.leo{background:linear-gradient(135deg,#f59e0b,#ea580c);font-weight:800;color:#0d0d0d}
    .mav.human{background:var(--s2);border:1px solid var(--border);color:var(--muted)}
    .bubble{max-width:82%;background:var(--surface);border:1px solid var(--border);
      border-radius:4px 16px 16px 16px;padding:12px 15px;font-size:13.5px;
      line-height:1.72;color:var(--text)}
    .msg.user .bubble{background:var(--ubg);border-color:var(--uborder);
      border-radius:16px 4px 16px 16px;color:#c9d8f8}
    .bm{font-size:10px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:4px}
    .qlabel{display:block;font-size:10px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
    .h{color:var(--a);font-weight:600}
    .hg{color:#4ade80;font-weight:600}

    /* Chunk typewriter cursor */
    .cur{display:inline-block;width:2px;height:13px;background:var(--a);
      margin-left:2px;vertical-align:middle;animation:cb .75s step-end infinite}
    @keyframes cb{0%,100%{opacity:1}50%{opacity:0}}

    /* ACK chip */
    .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
      color:#4ade80;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.18);
      border-radius:6px;padding:2px 8px;margin-bottom:8px}

    /* Thinking */
    .tb{background:var(--surface);border:1px solid var(--border);
      border-radius:4px 16px 16px 16px;padding:11px 14px;
      display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);font-style:italic}
    .dots{display:flex;gap:4px}
    .d{width:5px;height:5px;border-radius:50%;background:var(--a);
      animation:db 1.4s ease-in-out infinite}
    .d:nth-child(2){animation-delay:.16s}
    .d:nth-child(3){animation-delay:.32s}
    @keyframes db{0%,80%,100%{transform:scale(.65);opacity:.4}40%{transform:scale(1);opacity:1}}

    /* Summary card */
    .sc{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);
      border-radius:12px;padding:14px 16px;margin:10px 0 4px}
    .sct{font-size:11px;font-weight:700;color:var(--g);letter-spacing:.4px;
      text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .sr{display:flex;gap:8px;align-items:baseline;margin-bottom:5px}
    .sk{color:var(--muted);min-width:110px;font-size:11px;flex-shrink:0}
    .sv{color:var(--text);font-weight:500;font-size:12.5px}

    /* Prompt box */
    .pbox{background:#0a0a0a;border:1px solid var(--border);border-radius:12px;
      padding:14px;font-family:'Courier New',monospace;font-size:11px;line-height:1.65;
      color:#8a9ab8;max-height:280px;overflow-y:auto;white-space:pre-wrap;
      word-break:break-word;margin-top:12px;position:relative}
    .pbox::-webkit-scrollbar{width:4px}
    .pbox::-webkit-scrollbar-thumb{background:#333}
    .cpbtn{position:sticky;top:0;left:100%;display:block;width:fit-content;
      margin-left:auto;margin-bottom:8px;padding:5px 12px;border-radius:7px;
      background:var(--s2);border:1px solid var(--border);color:var(--dim);
      font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;
      font-family:'Inter',sans-serif}
    .cpbtn:hover{background:var(--a);color:#0d0d0d;border-color:var(--a)}

    /* ── INPUT ── */
    #inp-area{flex-shrink:0;padding:10px 16px 18px;
      background:linear-gradient(to top,var(--bg) 75%,transparent)}
    #qtags{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:9px}
    #qtags::-webkit-scrollbar{display:none}
    .qt{flex-shrink:0;padding:5px 11px;border-radius:8px;background:var(--surface);
      border:1px solid var(--border);color:var(--dim);font-size:11.5px;cursor:pointer;
      transition:all .18s;white-space:nowrap;font-family:'Inter',sans-serif}
    .qt:hover{border-color:var(--a);color:var(--a);background:var(--a-dim)}
    .irow{display:flex;align-items:center;gap:9px;background:var(--surface);
      border:1px solid var(--border);border-radius:14px;padding:9px 9px 9px 15px;
      transition:border-color .2s,box-shadow .2s}
    .irow:focus-within{border-color:var(--a);box-shadow:0 0 0 3px var(--a-dim)}
    #uin{flex:1;background:transparent;border:none;outline:none;color:var(--text);
      font-size:13.5px;font-family:'Inter',sans-serif}
    #uin::placeholder{color:var(--muted)}
    #sbtn{width:36px;height:36px;border-radius:10px;background:var(--a);border:none;
      color:#0d0d0d;font-size:13px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:all .2s;flex-shrink:0}
    #sbtn:hover:not(:disabled){background:#d97706;transform:scale(1.06)}
    #sbtn:disabled{opacity:.35;cursor:default;transform:none}

    /* ── SETTINGS ── */
    #sov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
      display:flex;align-items:flex-end;justify-content:center;
      opacity:0;pointer-events:none;transition:opacity .25s}
    #sov.open{opacity:1;pointer-events:all}
    .ss{background:var(--surface);border:1px solid var(--border);
      border-radius:20px 20px 0 0;padding:22px 20px 32px;
      width:100%;max-width:600px;
      transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
    #sov.open .ss{transform:translateY(0)}
    .sh{width:36px;height:3px;border-radius:999px;background:var(--border);margin:0 auto 18px}
    .st{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px}
    .sb{margin-bottom:13px}
    .sl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;
      letter-spacing:.5px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
    .sel{width:100%;background:var(--s2);border:1px solid var(--border);
      border-radius:10px;padding:9px 12px;color:var(--text);font-size:13px;
      font-family:'Inter',sans-serif;outline:none;appearance:none;-webkit-appearance:none}
    .sel:focus{border-color:var(--a)}

    /* API key */
    .arow{display:flex;gap:8px}
    .ainput{flex:1;background:var(--s2);border:1px solid var(--border);
      border-radius:10px;padding:9px 12px;color:var(--text);font-size:12px;
      font-family:'Inter',sans-serif;outline:none}
    .ainput:focus{border-color:var(--a)}
    .ainput::placeholder{color:var(--muted)}
    .asave{padding:9px 14px;border-radius:10px;background:var(--s2);
      border:1px solid var(--border);color:var(--dim);font-size:12px;font-weight:600;
    .abtn{width:100%;padding:12px;border-radius:12px;background:var(--a);border:none;
      color:#0d0d0d;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;
      font-family:'Inter',sans-serif;transition:background .2s}
    .abtn:hover{background:#d97706}

    /* ── TOAST ── */
    #toast{position:fixed;bottom:90px;left:50%;
      transform:translateX(-50%) translateY(16px);
      background:var(--g);color:#fff;padding:9px 18px;border-radius:12px;
      font-size:13px;font-weight:600;opacity:0;pointer-events:none;
      transition:all .28s;z-index:999;white-space:nowrap}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(min-width:768px){
      #chat{padding:36px 32px 0}
      #inp-area{padding:10px 32px 22px}
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="hl">
    <div class="av-w">
      <div class="av">L</div>
      <div class="av-ring" id="av-ring"></div>
    </div>
    <div>
      <div class="hd-title">Leo <span class="badge">2.1</span></div>
      <div class="hd-sub"><span class="dot-live"></span>Kiến trúc sư Sales Page · Phân tích thời gian thực</div>
    </div>
  </div>
  <div class="hr">
    <div class="mode-badge" id="mbadge" onclick="openS()">
      <span class="mode-dot" id="mdot"></span>
      <span id="mtext">Offline</span>
    </div>
    <button class="icon-btn" onclick="openS()" title="Cài đặt"><i class="fas fa-sliders-h"></i></button>
  </div>
</header>

<!-- ── PROGRESS ── -->
<div class="pt"><div class="pf" id="prog"></div></div>

<!-- ── CHAT ── -->
<div id="chat"><div class="cw" id="cw"></div></div>

<!-- ── INPUT ── -->
<div id="inp-area">
  <div id="qtags"></div>
  <div class="irow">
    <input id="uin" type="text" autocomplete="off"
      placeholder="Nhập câu trả lời của bạn..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey)send()">
    <button id="sbtn" onclick="send()"><i class="fas fa-arrow-up"></i></button>
  </div>
</div>

<!-- ── SETTINGS ── -->
<div id="sov" onclick="if(event.target===this)closeS()">
  <div class="ss">
    <div class="sh"></div>
    <div class="st">⚙ Cài đặt chiến dịch</div>

    <div class="sb">
      <div class="sl">Định dạng sản phẩm số</div>
      <select class="sel" id="sf">
        <option value="Ebook / Tài liệu PDF">Ebook / Tài liệu PDF</option>
        <option value="Khóa học Video quay sẵn">Khóa học Video quay sẵn</option>
        <option value="Template / Công cụ đóng gói">Template / Công cụ (Notion, Excel)</option>
        <option value="Dịch vụ Coaching / Tư vấn 1-1">Dịch vụ Coaching / Tư vấn 1-1</option>
      </select>
    </div>
    <div class="sb">
      <div class="sl">Mức độ nhận thức (Awareness)</div>
      <select class="sel" id="saw">
        <option value="Khách hàng mới nhận ra vấn đề (Problem Aware)">Mới nhận ra vấn đề (Problem Aware)</option>
        <option value="Khách hàng đã biết các giải pháp (Solution Aware)">Đã đi tìm giải pháp (Solution Aware)</option>
        <option value="Khách hàng đã biết bạn (Product Aware)">Đã biết đến bạn (Product Aware)</option>
      </select>
    </div>
    <div class="sb">
      <div class="sl">Giọng điệu (Tone of Voice)</div>
      <select class="sel" id="sto">
        <option value="Sắc bén, đanh thép, đi thẳng vào logic thực tế">Đanh thép, logic thực tế</option>
        <option value="Đồng cảm sâu sắc, chân thành kể chuyện">Đồng cảm, kể chuyện</option>
        <option value="Kịch tính, tạo cảm giác F.O.M.O khẩn cấp">Kịch tính, khẩn cấp</option>
      </select>
    </div>
    <button class="abtn" onclick="closeS()">Xác nhận</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
//  QUESTIONS — psychology-rewritten
// ══════════════════════════════════════════════════════════
const Q = [
  {
    // Easy opener, no jargon
    q:'Hãy cho tôi biết <span class="h">tên sản phẩm số</span> của bạn là gì?',
    h:['Khóa học Tiếng Anh giao tiếp','Ebook Xây kênh TikTok từ 0','Dịch vụ Setup hệ thống bán hàng tự động','Template Notion quản lý dự án']
  },
  {
    // Concretization: 1 specific real customer, not abstract "ICP"
    q:'Hãy nghĩ đến <span class="h">1 khách hàng đã mua và hài lòng nhất</span> của bạn. Họ là ai — làm nghề gì, khoảng mấy tuổi, và vấn đề gì khiến họ tìm đến bạn?',
    h:['Chị 35t, bán hàng online, muốn tăng doanh thu','Sinh viên 22t muốn kiếm tiền từ content','Anh 40t, chủ shop, chạy quảng cáo mãi không hiệu quả']
  },
  {
    // 11pm Question (Donald Miller): emotional moment, not abstract pain
    q:'Lúc <span class="h">11 giờ đêm</span>, khi họ chưa ngủ được — điều gì đang lởn vởn trong đầu họ liên quan đến vấn đề này?',
    h:['Tháng này lại không đủ tiền trả nhân viên','Học mãi vẫn không dám nói tiếng Anh với khách Tây','Chạy quảng cáo hết 5 triệu mà chỉ ra được 2 đơn']
  },
  {
    // "1-2 cách" — reduce recall burden, not "những cách"
    q:'Trước khi tìm đến bạn, họ đã thử <span class="h">1-2 cách</span> nào để giải quyết? Kết quả ra sao và vì sao thất bại?',
    h:['Tự học YouTube nhưng không biết áp dụng vào thực tế','Thuê người làm nhưng tốn tiền mà không kiểm soát được','Đã mua khóa học khác nhưng quá hàn lâm, không thực chiến']
  },
  {
    // Social proof anchor: "kể với bạn bè" → gets testimonial-format naturally
    q:'Sau khi dùng sản phẩm của bạn, <span class="h">cuộc sống họ thay đổi thế nào?</span> Điều đầu tiên họ kể với bạn bè là gì?',
    h:['Tháng đầu đã kiếm được 15 triệu từ affiliate','Lần đầu tự tin nói chuyện với khách nước ngoài','Hệ thống tự chạy, tôi nghỉ 3 ngày vẫn ra đơn']
  },
  {
    // Timeframe — kept with concrete anchors
    q:'Họ đạt được điều đó sau <span class="h">bao lâu?</span> Càng cụ thể càng tốt.',
    h:['Chỉ trong 30 ngày đầu tiên','Sau 8 tuần áp dụng đúng phương pháp','Ngay trong tuần đầu sau khi setup xong']
  },
  {
    // Lower the bar: "không cần hoành tráng, chỉ cần thật"
    q:'Bạn — hoặc người tạo ra sản phẩm — <span class="h">có gì khiến khách hàng tin tưởng?</span> Không cần hoành tráng, chỉ cần thật. Ví dụ: số năm làm, số người đã giúp, hay kết quả tự mình đạt được.',
    h:['5 năm làm marketing, đã giúp 200+ chủ shop','Tự mình đạt 100 triệu/tháng từ phương pháp này','Cựu giảng viên, từng training cho 3.000 học viên']
  },
  {
    // Simplified pricing: remove "chiến lược" jargon
    q:'Sản phẩm bán giá bao nhiêu? Có <span class="h">giá gốc</span> và <span class="h">giá ưu đãi</span> không?',
    h:['Giá gốc 2.000.000đ — Ưu đãi ra mắt còn 499.000đ','Chỉ 199.000đ (đã bao gồm toàn bộ tài liệu)','Freemium: Nhận tài liệu miễn phí — Upsell coaching 3.000.000đ']
  }
];

// 8 ACK verbs — rotated so pattern never repeats
const ACK = ['Đã ghi nhận','Capture xong','Insight đã lưu','Dữ liệu rõ','Đã phân tích','Locked in','Đã xử lý','Pattern xác định'];

// Thinking messages — step-contextual
const THK = [
  'Đang phân tích tên sản phẩm...',
  'Đang xây dựng chân dung khách hàng...',
  'Đang khai thác cấu trúc cảm xúc...',
  'Đang phân tích vòng lặp thất bại...',
  'Đang xây dựng mô hình chuyển đổi...',
  'Đang calibrate timeframe hứa hẹn...',
  'Đang đánh giá mức độ authority...',
  'Đang thiết kế ma trận giá...',
  'Đang biên dịch Mega Prompt...'
];

// Fallback reactions (when no API)
const FR = [
  a=>`Tôi đã ghi nhận <span class="h">"${a.trim().slice(0,40)}"</span>. Tên này sẽ xuất hiện ở Hero Section và toàn bộ CTA.`,
  a=>`Chân dung <span class="h">${kw(a)}</span> rõ ràng — tôi sẽ xây ngôn ngữ thấu cảm trực tiếp cho nhóm này.`,
  a=>`Nỗi đau <span class="h">"${kw(a)}"</span> sắc bén. Đây sẽ là điểm neo cảm xúc mở đầu Section 2.`,
  a=>`Thất bại với <span class="h">${kw(a)}</span> sẽ là vũ khí tâm lý mạnh nhất ở Section 3.`,

3 gợi ý ví dụ ngắn (≤8 từ/cái) phù hợp sản phẩm này. Trả về CHỈ JSON array. Tiếng Việt đời thường.`;
    try{
      if(this.mode==='nano'){
        const s=await window.ai.languageModel.create();
        const r=await s.prompt(p);
        const m=r.match(/\[.*?\]/s);
        return m?JSON.parse(m[0]):null;
      }
      if(this.mode==='gemini'){
        const r=await fetch(this.GNURL+this.key,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{parts:[{text:p}]}],
            generationConfig:{maxOutputTokens:80,temperature:.7}})

        const j=await r.json();
        const raw=j.candidates?.[0]?.content?.parts?.[0]?.text||'';

  async _gemini(prompt,el,max=80){
    const r=await fetch(this.GURL+this.key,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
        generationConfig:{maxOutputTokens:max,temperature:.85}})
    });
    if(!r.ok) throw new Error(r.status);
    const reader=r.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const ln of lines){
        if(!ln.startsWith('data: ')||ln.includes('[DONE]')) continue;
        try{

      if(d){el.appendChild(document.createTextNode(d));scrollB()}
    }
  }
};

// ══════════════════════════════════════════════════════════
//  CHUNK TYPEWRITER — 3 chars/16ms, mimics ChatGPT streaming
// ══════════════════════════════════════════════════════════
function chunk(el,html,n=3,ms=16){
  return new Promise(res=>{
    el.innerHTML='';
    const tokens=[];
    const re=/(<[^>]+>|&[^;]+;|[\s\S])/g;
    let m;
    while((m=re.exec(html))!==null) tokens.push(m[0]);
    let i=0;
    const CUR='<span class="cur"></span>';
    function tick(){
      if(i>=tokens.length){el.innerHTML=html;res();return}
      let added=0;
      while(i<tokens.length&&added<n){
        i++;
        if(!tokens[i-1].startsWith('<')) added++;
      }
      el.innerHTML=tokens.slice(0,i).join('')+CUR;
      scrollB();
      const last=tokens[i-1]||'';
      const delay=last==='.'||last==='!'||last==='?'?120:last===','?60:ms;
      setTimeout(tick,delay);
    }
    tick();
  });
}

function kw(text){
  const stop=new Set(['của','bạn','tôi','họ','này','đã','và','với','cho','trong','nhưng','không','được','một','những','các','có','là','mà','để','từ','khi','vì','thì','nên','hay','hoặc','theo','đến','tại','rất','quá','về','ra','lại']);
  const words=text.replace(/[^\w\sàáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđÀÁẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬÈÉẺẼẸÊẾỀỂỄỆÌÍỈĨỊÒÓỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÙÚỦŨỤƯỨỪỬỮỰỲÝỶỸỴĐ]/g,' ')
    .split(/\s+/).filter(w=>w.length>2&&!stop.has(w.toLowerCase()));
  return words[Math.floor(Math.random()*Math.min(words.length||1,5))]||text.slice(0,15);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function rm(id){document.getElementById(id)?.remove()}
function scrollB(){const c=document.getElementById('chat');c.scrollTop=c.scrollHeight}
function active(on){ring.classList.toggle('on',on)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function setIn(on){uin.disabled=!on;sbtn.disabled=!on;uin.placeholder=on?'Nhập câu trả lời của bạn...':'Leo đang xử lý...'}
function setP(cur,tot){prog.style.width=((cur/tot)*100)+'%'}
function tags(h){qtags.innerHTML='';(h||[]).forEach(t=>{const b=document.createElement('button');b.className='qt';b.textContent=t;b.onclick=()=>{uin.value=t;send()};qtags.appendChild(b)})}
function clearTags(){qtags.innerHTML=''}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function copyP(id){
  const el=document.getElementById(id);
  const btn=el.querySelector('.cpbtn');btn.style.display='none';
  const text=el.innerText.trim();btn.style.display='';
  (navigator.clipboard?.writeText(text)??Promise.reject()).catch(()=>{
    const ta=Object.assign(document.createElement('textarea'),{value:text});
    document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  });
  toast('<i class="fas fa-check-circle"></i> Đã sao chép Mega Prompt!');
}
</script>
