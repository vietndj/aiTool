<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leo 2.0 — Kiến trúc sư Sales Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d0d;
      --surface:     #181818;
      --surface-2:   #222222;
      --border:      #2c2c2c;
      --text:        #e8e8e8;
      --text-muted:  #777;
      --text-dim:    #999;
      --accent:      #f59e0b;
      --accent-dim:  rgba(245,158,11,0.12);
      --accent-glow: rgba(245,158,11,0.25);
      --user-bg:     #1c2235;
      --user-border: #283047;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 50;
    }
    .hdr-left { display: flex; align-items: center; gap: 12px; }

    /* Avatar with pulse ring */
    .av-wrap { position: relative; width: 38px; height: 38px; }
    .av {
      width: 38px; height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: #0d0d0d;
      position: relative; z-index: 2;
      box-shadow: 0 0 14px rgba(245,158,11,0.2);
    }
    .av-ring {
      position: absolute; inset: -4px;
      border-radius: 14px;
      border: 2px solid var(--accent);
      opacity: 0;
      transition: opacity .3s;
    }
    .av-ring.on {
      opacity: 1;
      animation: ring-pulse 1.6s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%,100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50%      { box-shadow: 0 0 0 7px transparent; }
    }

    .hdr-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 7px;
    }
    .badge {
      font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 999px;
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid rgba(245,158,11,0.25);
      letter-spacing: .5px; text-transform: uppercase;
    }
    .hdr-sub {
      font-size: 11px; color: var(--text-dim);
      display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    .dot-live {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e;
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    .hdr-right { display: flex; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px;
      transition: all .2s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }

    /* ─── PROGRESS BAR ─── */
    .prog-track { height: 2px; background: var(--border); flex-shrink: 0; }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ea580c);
      width: 0%; transition: width .6s cubic-bezier(.4,0,.2,1);
    }

    /* ─── CHAT AREA ─── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 16px 0;
      scroll-behavior: smooth;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-thumb { background: #333; border-radius: 999px; }

    .chat-wrap {
      max-width: 660px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 20px;
    }

    /* Message rows */
    .msg {
      display: flex;
      gap: 10px;
      animation: rise .28s ease-out;
    }
    @keyframes rise {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-av {
      width: 30px; height: 30px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0; margin-top: 2px;
    }
    .msg-av.leo-av {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      font-weight: 800; color: #0d0d0d;
    }
    .msg-av.user-av {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    /* Bubbles */
    .bubble {
      max-width: 80%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 12px 15px;
      font-size: 13.5px;
      line-height: 1.72;
      color: var(--text);
      position: relative;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-color: var(--user-border);
      border-radius: 16px 4px 16px 16px;
      color: #c9d8f8;
    }
    .bubble-meta {
      font-size: 10px; color: var(--text-muted);
      margin-top: 7px;
      display: flex; align-items: center; gap: 4px;
    }

    /* Inline reaction chip */
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600;
      color: #4ade80;
      background: rgba(74,222,128,.08);
      border: 1px solid rgba(74,222,128,.18);
      border-radius: 6px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }

    /* Typing cursor inside bubble */
    .cursor {
      display: inline-block;
      width: 2px; height: 13px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: middle;
      animation: cur-blink .75s step-end infinite;
    }
    @keyframes cur-blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Label above question */
    .q-label {
      display: block;
      font-size: 10px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .6px;
      margin-bottom: 5px;
    }

    /* Highlights inside Leo text */
    .hl        { color: var(--accent); font-weight: 600; }
    .hl-green  { color: #4ade80; font-weight: 600; }

    /* Thinking row */
    .thinking-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 11px 14px;
      display: flex; align-items: center; gap: 9px;
      font-size: 12px; color: var(--text-muted); font-style: italic;
    }
    .dots { display: flex; gap: 4px; }
    .d {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .d:nth-child(2) { animation-delay: .16s; }
    .d:nth-child(3) { animation-delay: .32s; }
    @keyframes dot-bounce {
      0%,80%,100% { transform: scale(.65); opacity: .4; }
      40%          { transform: scale(1);   opacity: 1;  }
    }

    /* Prompt output */
    .prompt-box {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px 14px 14px;
      font-family: 'Courier New', monospace;
      font-size: 11px; line-height: 1.65;
      color: #8a9ab8;
      max-height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 12px;
      position: relative;
    }
    .prompt-box::-webkit-scrollbar { width: 4px; }
    .prompt-box::-webkit-scrollbar-thumb { background: #333; }

    .copy-btn {
      position: sticky; top: 0; left: 100%;
      display: block; width: fit-content; margin-left: auto; margin-bottom: 8px;
      padding: 5px 12px;
      border-radius: 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Inter', sans-serif;
    }
    .copy-btn:hover { background: var(--accent); color: #0d0d0d; border-color: var(--accent); }

    /* ─── INPUT AREA ─── */
    #input-area {
      flex-shrink: 0;
      padding: 10px 16px 18px;
      background: linear-gradient(to top, var(--bg) 75%, transparent);
    }
    #quick-tags {
      display: flex; gap: 7px;
      overflow-x: auto; padding-bottom: 2px;
      margin-bottom: 9px;
    }
    #quick-tags::-webkit-scrollbar { display: none; }
    .qtag {
      flex-shrink: 0;
      padding: 5px 11px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11.5px;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }
    .qtag:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    .input-row {
      display: flex; align-items: center; gap: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 9px 9px 9px 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    #user-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 13.5px;
      font-family: 'Inter', sans-serif;
    }
    #user-input::placeholder { color: var(--text-muted); }
    #user-input:disabled { opacity: .6; }

    #send-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--accent); border: none;
      color: #0d0d0d; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all .2s; flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: #d97706; transform: scale(1.06); }
    #send-btn:disabled { opacity: .35; cursor: default; transform: none; }

    /* ─── SETTINGS OVERLAY ─── */
    #settings-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    #settings-overlay.open { opacity: 1; pointer-events: all; }

    .settings-sheet {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 22px 20px 32px;
      width: 100%; max-width: 600px;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    #settings-overlay.open .settings-sheet { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 3px;
      border-radius: 999px; background: var(--border);
      margin: 0 auto 18px;
    }
    .sheet-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      margin-bottom: 14px;
    }
    .setting-block { margin-bottom: 13px; }
    .setting-label {
      font-size: 10px; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 5px;
    }
    .setting-select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text); font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none; appearance: none; -webkit-appearance: none;
    }
    .setting-select:focus { border-color: var(--accent); }

    .apply-btn {
      width: 100%; padding: 12px;
      border-radius: 12px;
      background: var(--accent); border: none;
      color: #0d0d0d; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
      font-family: 'Inter', sans-serif;
      transition: background .2s;
    }
    .apply-btn:hover { background: #d97706; }

    /* ─── TOAST ─── */
    #toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #22c55e; color: #fff;
      padding: 9px 18px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: all .28s; z-index: 999;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 768px) {
      #chat-area { padding: 36px 32px 0; }
      #input-area { padding: 10px 32px 22px; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="hdr-left">
    <div class="av-wrap">
      <div class="av">L</div>
      <div class="av-ring" id="av-ring"></div>
    </div>
    <div>
      <div class="hdr-title">
        Leo <span class="badge">2.0</span>
      </div>
      <div class="hdr-sub">
        <span class="dot-live"></span>
        Kiến trúc sư Sales Page · Phân tích thời gian thực
      </div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="icon-btn" onclick="openSettings()" title="Cài đặt chiến dịch">
      <i class="fas fa-sliders-h"></i>
    </button>
  </div>
</header>

<!-- ── PROGRESS BAR ── -->
<div class="prog-track">
  <div class="prog-fill" id="prog"></div>
</div>

<!-- ── CHAT AREA ── -->
<div id="chat-area">
  <div class="chat-wrap" id="chat-wrap"></div>
</div>

<!-- ── INPUT AREA ── -->
<div id="input-area">
  <div id="quick-tags"></div>
  <div class="input-row">
    <input id="user-input" type="text" autocomplete="off"
      placeholder="Nhập câu trả lời của bạn..."
      onkeydown="if(event.key==='Enter'&&!event.shiftKey)handleSend()">
    <button id="send-btn" onclick="handleSend()">
      <i class="fas fa-arrow-up"></i>
    </button>
  </div>
</div>

<!-- ── SETTINGS OVERLAY ── -->
<div id="settings-overlay" onclick="if(event.target===this)closeSettings()">
  <div class="settings-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">⚙ Cài đặt chiến dịch</div>

    <div class="setting-block">
      <div class="setting-label">Định dạng sản phẩm số</div>
      <select class="setting-select" id="setting-format">
        <option value="Ebook / Tài liệu PDF">Ebook / Tài liệu PDF</option>
        <option value="Khóa học Video quay sẵn">Khóa học Video quay sẵn</option>
        <option value="Template / Công cụ đóng gói">Template / Công cụ (Notion, Excel)</option>
        <option value="Dịch vụ Coaching / Tư vấn 1-1">Dịch vụ Coaching / Tư vấn 1-1</option>
      </select>
    </div>
    <div class="setting-block">
      <div class="setting-label">Mức độ nhận thức (Awareness)</div>
      <select class="setting-select" id="setting-awareness">
        <option value="Khách hàng mới nhận ra vấn đề (Problem Aware)">Mới nhận ra vấn đề (Problem Aware)</option>
        <option value="Khách hàng đã biết các giải pháp (Solution Aware)">Đã đi tìm giải pháp (Solution Aware)</option>
        <option value="Khách hàng đã biết bạn (Product Aware)">Đã biết đến bạn (Product Aware)</option>
      </select>
    </div>
    <div class="setting-block">
      <div class="setting-label">Giọng điệu (Tone of Voice)</div>
      <select class="setting-select" id="setting-tone">
        <option value="Sắc bén, đanh thép, đi thẳng vào logic thực tế">Đanh thép, logic thực tế</option>
        <option value="Đồng cảm sâu sắc, chân thành kể chuyện">Đồng cảm, kể chuyện</option>
        <option value="Kịch tính, tạo cảm giác F.O.M.O khẩn cấp">Kịch tính, khẩn cấp</option>
      </select>
    </div>

    <button class="apply-btn" onclick="closeSettings()">Áp dụng cài đặt</button>
  </div>
</div>

<!-- ── TOAST ── -->
<div id="toast"><i class="fas fa-check-circle"></i> Đã sao chép Mega Prompt!</div>

<script>
// ══════════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════════
const QUESTIONS = [
  {
    q: 'Hãy cho tôi biết <span class="hl">tên sản phẩm số</span> của bạn là gì?',
    hints: ['Khóa học Tiếng Anh giao tiếp', 'Ebook Xây kênh TikTok', 'Dịch vụ Setup hệ thống tự động', 'Template Notion quản lý dự án']
  },
  {
    q: '<span class="hl">Khách hàng mục tiêu (ICP)</span> của bạn là ai — đặc điểm, độ tuổi, nghề nghiệp?',
    hints: ['Mẹ bỉm sữa muốn kinh doanh online', 'Sinh viên mới ra trường muốn freelance', 'Chủ doanh nghiệp SME 30-45 tuổi']
  },
  {
    q: '<span class="hl">Nỗi đau nhức nhối nhất</span> và cảm xúc tiêu cực họ gặp hàng ngày là gì?',
    hints: ['Làm nhiều nhưng thu nhập không tăng', 'Học nhiều khóa nhưng không áp dụng được', 'Chạy quảng cáo đốt tiền nhưng không ra đơn']
  },
  {
    q: 'Họ đã <span class="hl">thử những cách gì</span> trong quá khứ nhưng thất bại? Vì sao thất bại?',
    hints: ['Tự học YouTube nhưng kiến thức chắp vá', 'Thuê Agency nhưng nội dung không hiệu quả', 'Thử nhiều phương pháp nhưng thiếu hệ thống bài bản']
  },
  {
    q: '<span class="hl">Kết quả lớn nhất</span> (Transformation thực tế) họ đạt được sau khi dùng sản phẩm của bạn?',
    hints: ['Tự tin giao tiếp tiếng Anh với người nước ngoài', 'Xây phễu tự động đạt 50 đơn/ngày', 'Tăng gấp 3 thu nhập chỉ sau 2 tháng']
  },
  {
    q: 'Mất bao lâu để đạt được kết quả đó? <span class="hl">(Timeframe cụ thể)</span>',
    hints: ['Chỉ trong 30 ngày đầu tiên', 'Sau 8 tuần áp dụng đúng phương pháp', 'Ngay sau 24h setup xong hệ thống']
  },
  {
    q: '<span class="hl">Ai là người tạo ra sản phẩm</span> — tên, chức danh, thành tựu bảo chứng uy tín?',
    hints: ['Trần A — Founder với 5 năm kinh nghiệm thực chiến', 'Nguyễn B — Top 10 Marketer Việt Nam 2023', 'Dược sĩ C — 10 năm lâm sàng, đào tạo 5.000+ học viên']
  },
  {
    q: '<span class="hl">Chiến lược giá</span> của bạn thế nào? Bao gồm giá gốc và giá ưu đãi hiện tại (VNĐ).',
    hints: ['Giá gốc 2.000.000đ — Ưu đãi còn 499.000đ', 'Chỉ 199.000đ (Giá trị thực 1.000.000đ)', 'Miễn phí tài liệu — Upsell sau 30 ngày']
  }
];

// Contextual reactions per step — reference user's actual keywords
const REACTIONS = [
  ans => `Tôi đã ghi nhận <span class="hl">"${ans.trim()}"</span>. Tên này sẽ xuất hiện ở Hero Section và toàn bộ các nút CTA.`,
  ans => `Tệp <span class="hl">${kw(ans)}</span> có tỷ lệ chốt cao khi đánh đúng cảm xúc. Tôi đang lập bản đồ tâm lý cho nhóm này.`,
  ans => `Nỗi đau <span class="hl">"${kw(ans)}"</span> — sắc bén. Tôi sẽ dùng chính ngôn ngữ này làm điểm neo cảm xúc ở Section 2.`,
  ans => `Điểm mù thị trường: <span class="hl">${kw(ans)}</span>. Cái này sẽ phá vỡ định kiến mạnh mẽ ở Section 3 — Cycle of Failing.`,
  ans => `Transformation <span class="hl">"${kw(ans)}"</span> rất cụ thể — tôi sẽ biến nó thành Headline hứa hẹn ở Hero Section.`,
  ans => `Timeframe <span class="hl">${kw(ans)}</span> cụ thể và đáng tin. Sẽ kích hoạt Desire mạnh — tôi sẽ lặp lại ít nhất 3 lần trong toàn bộ copy.`,
  ans => `Authority của <span class="hl">${kw(ans)}</span> đủ mạnh để phá rào cản hoài nghi. Section 10 sẽ được xây dựng kỹ.`,

// ══════════════════════════════════════════════════════════
//  TYPEWRITER ENGINE  (HTML-aware)
// ══════════════════════════════════════════════════════════
function typewriter(el, html, speed, onDone) {
  el.innerHTML = '';
  // Tokenise: complete HTML tags & entities are atomic; everything else is a single char
  const tokens = [];
  const re = /(<[^>]+>|&[^;]+;|[\s\S])/g;
  let m;
  while ((m = re.exec(html)) !== null) tokens.push(m[0]);

  let i = 0;
  const CURSOR = '<span class="cursor"></span>';

  function tick() {
    if (i < tokens.length) {
      el.innerHTML = tokens.slice(0, i + 1).join('') + CURSOR;
      i++;
      const t = tokens[i - 1];
      const delay = (t === '.' || t === '!' || t === '?') ? 90
                  : (t === ',') ? 50
                  : (t === ' ' || t.startsWith('<')) ? 10
                  : speed;
      setTimeout(tick, delay);
      scrollBottom();
    } else {
      el.innerHTML = html;
      if (onDone) onDone();
      scrollBottom();
    }
  }
  tick();
}

function leoSay(html, onDone) {
  busy = true;
  setActive(true);
  setInput(false);

  const row = mkEl('div', 'msg');
  row.innerHTML = `<div class="msg-av leo-av">L</div><div class="bubble"><div class="txt"></div><div class="bubble-meta"><i class="fas fa-check-double" style="color:#f59e0b"></i> ${now()}</div></div>`;
  chatWrap.appendChild(row);
  scrollBottom();

  typewriter(row.querySelector('.txt'), html, 20, () => {
    busy = false;
    setActive(false);
    if (onDone) onDone();
  });
}

function userSay(text) {
  const row = mkEl('div', 'msg user');
  row.innerHTML = `
    <div class="msg-av user-av"><i class="fas fa-user" style="font-size:11px"></i></div>
    <div class="bubble"><div class="txt">${esc(text)}</div><div class="bubble-meta">${now()}</div></div>
  `;
  chatWrap.appendChild(row);
  scrollBottom();
}

function showThinking(msg) {
  const id = 'th-' + Date.now();
  const row = mkEl('div', 'msg');
  row.id = id;
  row.innerHTML = `
    <div class="msg-av leo-av">L</div>
    <div class="thinking-bubble">
      <div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div></div>

  chatWrap.appendChild(row);

function askQuestion(n) {
  const q = QUESTIONS[n];
  leoSay(
    `<span class="q-label">Câu ${n + 1} / 8</span>` + q.q,
    () => {
      setTags(q.hints);
      setInput(true);
      inputEl.focus();
    }
  );
}

function handleSend() {
  const val = inputEl.value.trim();
  if (!val || busy || step >= 8) return;

  data[`q${step + 1}`] = val;
  userSay(val);
  inputEl.value = '';
  clearTags();
  setInput(false);

  const s = step;
  step++;
  setProgress(step, 8);

  // Delay ∝ answer length → feels like "reading" the answer
  const delay = 650 + Math.min(val.length * 16, 1800) + Math.random() * 350;
  const thId = showThinking(THINKING[s]);
  setActive(true);

  setTimeout(() => {
    rmEl(thId);
    setActive(false);

    if (step < 8) {
      const reaction = REACTIONS[s](val);
      const nextQ = `<span class="q-label">Câu ${step + 1} / 8</span>` + QUESTIONS[step].q;
      leoSay(
        `<span class="chip"><i class="fas fa-check"></i> Đã ghi nhận</span><br>${reaction}<br><br>${nextQ}`,
        () => {
          setTags(QUESTIONS[step].hints);
          setInput(true);
          inputEl.focus();
        }
      );
    } else {
      generatePrompt();
    }
  }, delay);
}

      `<span style="color:var(--text-muted);font-size:12.5px">Tôi đã nhúng toàn bộ 8 câu trả lời của bạn vào cấu trúc 11 section. ` +

      () => {
        // Step 2: Append prompt box instantly (no typewriter — too long)
        const promptId = 'pr-' + Date.now();
        const row = mkEl('div', 'msg');
        row.innerHTML = `
          <div class="msg-av leo-av" style="background:linear-gradient(135deg,#22c55e,#0d9488)"><i class="fas fa-code" style="font-size:11px"></i></div>

        rb.onclick = () => location.reload();
        tagsEl.appendChild(rb);

        scrollBottom();
      }
    );
  }, 1800);
}

// ══════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════
// Extract most meaningful keyword from answer
function kw(text) {
  const stop = new Set(['của','bạn','tôi','họ','này','đã','và','với','cho','trong',
    'nhưng','không','được','một','những','các','có','là','mà','để','từ','khi',
    'vì','thì','nên','hay','hoặc','theo','đến','tại','rất','quá','về','ra','lại']);
  const words = text
    .replace(/[^\w\sàáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđÀÁẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬÈÉẺẼẸÊẾỀỂỄỆÌÍỈĨỊÒÓỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÙÚỦŨỤƯỨỪỬỮỰỲÝỶỸỴĐ]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 2 && !stop.has(w.toLowerCase()));
  if (!words.length) return text.substring(0, 20);
  return words[Math.floor(Math.random() * Math.min(words.length, 5))];
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function mkEl(tag, cls) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  return el;
}

function rmEl(id) { document.getElementById(id)?.remove(); }

function scrollBottom() {
  const c = document.getElementById('chat-area');
  c.scrollTop = c.scrollHeight;
}

function setActive(on) { avRing.classList.toggle('on', on); }

function setInput(on) {
  inputEl.disabled = !on;
  sendBtn.disabled = !on;
  inputEl.placeholder = on ? 'Nhập câu trả lời của bạn...' : 'Leo đang xử lý...';
}

function setProgress(cur, total) {
  progEl.style.width = ((cur / total) * 100) + '%';
}

function setTags(hints) {
  tagsEl.innerHTML = '';
  hints.forEach(h => {
    const b = document.createElement('button');
    b.className = 'qtag';
    b.textContent = h;
    b.onclick = () => { inputEl.value = h; handleSend(); };
    tagsEl.appendChild(b);
  });
}

function clearTags() { tagsEl.innerHTML = ''; }

// Settings
function openSettings()  { document.getElementById('settings-overlay').classList.add('open'); }
function closeSettings() { document.getElementById('settings-overlay').classList.remove('open'); }

// Copy prompt
function copyPrompt(id) {
  const el = document.getElementById(id);
  // Get raw text, skip the Copy button text
  const btn = el.querySelector('.copy-btn');
  btn.style.display = 'none';
  const text = el.innerText.trim();
  btn.style.display = '';

  (navigator.clipboard?.writeText(text) ?? Promise.reject()).catch(() => {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  });

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}
