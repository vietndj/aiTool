<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Leo 1.0 | Phễu Sales Page Sản Phẩm Số</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0a0a0a',
                            panel: '#121212',
                            border: '#262626',
                            accent: '#f59e0b', // Amber 500
                            accentHover: '#d97706'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #404040; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }

        /* Animation cho Chat */
        .fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .glowing-amber { box-shadow: 0 0 20px rgba(245, 158, 11, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <header class="w-full bg-[#121212] border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
                <i class="fas fa-bolt text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-2">
                    Trợ lý Leo <span class="text-[10px] bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded-full border border-amber-500/30 uppercase tracking-wider">Version 1.0</span>
                </h1>
                <p class="text-xs text-zinc-400">Kiến trúc sư Sales Page chuyển đổi cao cho Sản phẩm số</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1.5 bg-[#1a1a1a] rounded-lg border border-zinc-800 text-xs">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-zinc-300 font-medium">Trạng thái: Thu thập dữ liệu thời gian thực</span>
            </div>
        </div>
    </header>

    <div class="flex-1 w-full max-w-7xl mx-auto flex flex-col lg:flex-row overflow-hidden relative">
        
        <!-- BẢNG TRÁI: Cấu hình phong cách (1/4) -->
        <aside class="w-full lg:w-[300px] bg-[#121212] border-b lg:border-b-0 lg:border-r border-zinc-800 p-5 flex flex-col gap-6 shrink-0 z-10">
            <div>
                <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-sliders text-amber-500"></i> Thuộc tính chiến dịch
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Phân loại sản phẩm số</label>
                        <select id="setting-format" class="w-full bg-[#1a1a1a] border border-zinc-700 rounded-lg py-2 px-3 text-sm text-zinc-200 outline-none focus:border-amber-500 transition-colors">
                            <option value="Ebook / Tài liệu PDF">Ebook / Tài liệu PDF</option>
                            <option value="Khóa học Video quay sẵn">Khóa học Video quay sẵn</option>
                            <option value="Template / Công cụ đóng gói">Template / Công cụ đóng gói (Notion, Excel)</option>
                            <option value="Dịch vụ Coaching / Tư vấn">Dịch vụ Coaching / Tư vấn 1-1</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Mức độ nhận thức (Awareness)</label>
                        <select id="setting-awareness" class="w-full bg-[#1a1a1a] border border-zinc-700 rounded-lg py-2 px-3 text-sm text-zinc-200 outline-none focus:border-amber-500 transition-colors">
                            <option value="Khách hàng mới nhận ra vấn đề (Problem Aware)">Mới nhận ra vấn đề (Problem Aware)</option>
                            <option value="Khách hàng đã biết các giải pháp (Solution Aware)">Đã đi tìm giải pháp (Solution Aware)</option>
                            <option value="Khách hàng đã biết bạn (Product Aware)">Đã biết đến bạn (Product Aware)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Giọng điệu (Tone of Voice)</label>
                        <select id="setting-tone" class="w-full bg-[#1a1a1a] border border-zinc-700 rounded-lg py-2 px-3 text-sm text-zinc-200 outline-none focus:border-amber-500 transition-colors">
                            <option value="Sắc bén, đanh thép, đi thẳng vào logic thực tế">Đanh thép, logic thực tế</option>
                            <option value="Đồng cảm sâu sắc, chân thành kể chuyện">Đồng cảm, kể chuyện</option>
                            <option value="Kịch tính, tạo cảm giác F.O.M.O khẩn cấp">Kịch tính, khẩn cấp</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tiến trình thu thập dữ liệu -->
            <div class="border-t border-zinc-800 pt-5 mt-auto">
                <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i class="fas fa-bars-progress text-emerald-500"></i> Tiến trình phân tích
                </h2>
                <div class="w-full bg-zinc-800 rounded-full h-2 mb-2 overflow-hidden border border-zinc-700">
                    <div id="progress-bar" class="bg-gradient-to-r from-amber-500 to-orange-500 h-2 rounded-full transition-all duration-500 w-0"></div>
                </div>
                <p class="text-[11px] text-zinc-400 font-medium" id="progress-text">Hoàn thành: 0/8 dữ liệu</p>
            </div>
        </aside>

        <!-- KHU VỰC GIỮA: Giao tiếp & Thu thập -->
        <main class="flex-1 flex flex-col bg-[#0a0a0a] border-r border-zinc-800 overflow-hidden relative">
            <div id="chat-history" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth pb-32">
                <!-- Chat tự động sinh bằng JS -->
            </div>

            <!-- Khung nhập liệu tĩnh ở đáy -->
            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a] to-transparent pt-10">
                <div id="quick-tags" class="flex gap-2 mb-3 overflow-x-auto pb-1 hide-scrollbar">
                    <!-- Gợi ý động sinh bằng JS -->
                </div>
                <div class="flex items-center gap-3 bg-[#1a1a1a] border border-zinc-700/80 rounded-xl px-4 py-2 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500/50 transition-all shadow-lg">
                    <input type="text" id="user-input" onkeypress="handleEnter(event)" placeholder="Nhập câu trả lời của bạn..." class="flex-1 bg-transparent text-zinc-100 text-sm outline-none border-none placeholder-zinc-500">
                    <button id="send-btn" onclick="processInput()" class="w-9 h-9 rounded-lg bg-amber-500 hover:bg-amber-600 text-zinc-900 flex items-center justify-center transition-all shadow-md">
                        <i class="fas fa-arrow-up text-xs font-bold"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- BẢNG PHẢI: Bản đồ Cấu trúc (1/4) -->
        <section class="w-full lg:w-[320px] bg-[#121212] border-t lg:border-t-0 lg:border-l border-zinc-800 p-5 flex flex-col overflow-hidden z-10 hidden lg:flex">
            <div class="flex items-center justify-between mb-4 border-b border-zinc-800 pb-3">
                <h3 class="text-xs font-bold text-zinc-200 uppercase tracking-widest flex items-center gap-2">
                    <i class="fas fa-sitemap text-amber-500"></i> Bản đồ 11 Phân Khu
                </h3>
            </div>
            <div class="flex-1 overflow-y-auto pr-2 space-y-2.5 opacity-60" id="structure-map">
                <!-- Sinh bằng JS -->
            </div>
        </section>
    </div>

    <!-- Toast Copy -->
    <div id="toast" class="fixed top-6 right-6 z-50 bg-emerald-600 text-white px-4 py-3 rounded-lg shadow-xl transform translate-y-[-100%] opacity-0 transition-all duration-300 flex items-center gap-3">
        <i class="fas fa-check-circle"></i>
        <span class="text-sm font-medium">Đã sao chép cấu trúc Mega Prompt!</span>
    </div>

    <script>
        // --- CƠ SỞ DỮ LIỆU CÂU HỎI & LOGIC ---
        const questions = [
            {
                q: "1. Tên sản phẩm số của bạn là gì? (Ví dụ: Ebook Content Marketing, Khóa học Kế toán...)",
                hints: ["Khóa học Tiếng Anh giao tiếp", "Ebook Xây kênh Tiktok", "Dịch vụ Setup Hệ thống tự động"]
            },
            {
                q: "2. Thị trường mục tiêu (ICP) của bạn là ai? (Đặc điểm nhận diện, độ tuổi, nghề nghiệp...)",
                hints: ["Mẹ bỉm sữa muốn kinh doanh", "Sinh viên mới ra trường", "Chủ doanh nghiệp SME"]
            },
            {
                q: "3. Vấn đề nhức nhối nhất và cảm xúc tiêu cực họ đang gặp phải là gì?",
                hints: ["Làm quần quật không có lãi, stress", "Học nhiều khóa học nhưng vẫn không nói được tiếng Anh", "Chạy quảng cáo đốt tiền nhưng không ra đơn"]
            },
            {
                q: "4. Họ từng thử những cách gì trong quá khứ nhưng thất bại? Tại sao lại thất bại?",
                hints: ["Từng thuê Agency nhưng nội dung sáo rỗng", "Tự học trên mạng nhưng kiến thức chắp vá", "Đã thử nhịn ăn giảm cân nhưng bị tăng lại"]
            },
            {
                q: "5. Sự thay đổi lớn nhất (Kết quả thực tế) họ nhận được sau khi dùng sản phẩm của bạn?",
                hints: ["Tự tin giao tiếp tiếng Anh với Tây", "Xây dựng được phễu tự động mang về 50 đơn/ngày", "Giảm 5kg an toàn không mệt mỏi"]
            },
            {
                q: "6. Mất bao lâu để họ đạt được kết quả đó? (Timeframe)",
                hints: ["Chỉ trong 30 ngày", "Sau 8 tuần áp dụng", "Ngay sau khi setup xong hệ thống (24h)"]
            },
            {
                q: "7. Ai là người tạo ra sản phẩm này? (Họ tên, chức danh, thành tựu bảo chứng uy tín)",
                hints: ["Trần A - Founder với 5 năm kinh nghiệm", "Nguyễn B - Chuyên gia đạt giải Nhất Marketing", "Dược sĩ C - 10 năm lâm sàng"]
            },
            {
                q: "8. Chiến lược giá của bạn thế nào? (Bao gồm Giá gốc và Giá ưu đãi VNĐ)",
                hints: ["Giá gốc 2.000.000đ - Ưu đãi còn 499.000đ", "Chỉ 199k (Giá trị thực 1 triệu)", "Miễn phí nhận tài liệu - Upsell sau"]
            }
        ];

        // Phản hồi giả lập AI để tạo cảm giác thông minh
        const aiReactions = [
            "Định dạng này cực kỳ dễ scale rập khuôn.",
            "Tệp khách hàng này rất dễ bị chốt sale nếu đánh trúng nỗi đau.",
            "Nỗi đau rất sắc bén. Ta sẽ xoáy sâu vào cảm xúc này ở Section 2.",
            "Điểm mù thị trường! Ta sẽ dùng cái này để đập tan định kiến ở Section 3.",
            "Kết quả rất rõ ràng. Tôi sẽ biến nó thành Headline hứa hẹn ở Section 1.",
            "Timeframe cụ thể sẽ giúp kích hoạt khao khát (Desire) mạnh mẽ.",
            "Uy tín (Authority) tốt. Sự tin tưởng là chốt chặn cuối cùng.",
            "Mức giá chênh lệch tốt, dễ tạo hiệu ứng chim mồi và khan hiếm."
        ];

        const collectedData = {};
        let currentStep = 0;

        // Elements
        const chatBox = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const quickTags = document.getElementById('quick-tags');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // Khởi tạo
        window.onload = () => {
            renderMap();
            setTimeout(() => {
                appendLeoMessage(`Chào bạn, tôi là Leo 1.0 - trợ lý xây dựng phễu Sales Page. Thay vì bắt bạn tự copy lệnh dài và ngồi chat với AI, tôi sẽ phân tích dữ liệu trước để tạo ra một cấu trúc hoàn chỉnh nhất.<br><br>Hãy bắt đầu nhé: <br><strong class="text-amber-400">${questions[0].q}</strong>`);
                updateTags(questions[0].hints);
            }, 500);
        };

        // UI Helpers
        function handleEnter(e) { if(e.key === 'Enter') processInput(); }
        
        function useTag(text) {
            userInput.value = text;
            processInput();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Cập nhật Tags động
        function updateTags(hints) {
            quickTags.innerHTML = '';
            hints.forEach(hint => {
                const btn = document.createElement('button');
                btn.className = 'shrink-0 px-3 py-1.5 bg-[#1a1a1a] hover:bg-[#262626] border border-zinc-800 rounded-lg text-xs text-zinc-300 transition-all';
                btn.innerText = hint;
                btn.onclick = () => useTag(hint);
                quickTags.appendChild(btn);
            });
        }

        // Render Tin nhắn User
        function appendUserMessage(text) {
            const html = `
                <div class="flex gap-4 items-start max-w-[85%] self-end flex-row-reverse ml-auto fade-in-up">
                    <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-300 shrink-0 border border-zinc-700">
                        <i class="fas fa-user text-sm"></i>
                    </div>
                    <div class="bg-zinc-800/40 border border-zinc-700 text-zinc-200 rounded-2xl rounded-tr-none p-4 text-sm leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // Render Tin nhắn Leo
        function appendLeoMessage(text) {
            const html = `
                <div class="flex gap-4 items-start max-w-[85%] fade-in-up">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-orange-600 flex items-center justify-center text-zinc-900 shrink-0 shadow-md">
                        <i class="fas fa-bolt text-sm"></i>
                    </div>
                    <div class="bg-[#1a1a1a] border border-zinc-800 text-zinc-200 rounded-2xl rounded-tl-none p-4 text-sm leading-relaxed shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        // Render Loading
        function appendLoading() {
            const id = 'loading-' + Date.now();
            const html = `
                <div class="flex gap-4 items-start max-w-[85%] fade-in-up" id="${id}">
                    <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-amber-500 shrink-0 border border-zinc-700">
                        <i class="fas fa-microchip text-sm"></i>
                    </div>
                    <div class="bg-[#1a1a1a] border border-zinc-800 text-zinc-400 rounded-2xl rounded-tl-none px-5 py-4 flex gap-1.5 items-center">
                        <span class="text-xs italic mr-2">Leo đang phân tích</span>
                        <div class="w-1.5 h-1.5 rounded-full bg-amber-500 typing-dot"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-amber-500 typing-dot"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-amber-500 typing-dot"></div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return id;
        }

        // Tiến trình
        function updateProgress() {
            const percent = (currentStep / 8) * 100;
            progressBar.style.width = `${percent}%`;
            progressText.innerText = `Hoàn thành: ${currentStep}/8 dữ liệu`;
        }

        // Logic Xử lý nhập liệu
        function processInput() {
            const text = userInput.value.trim();
            if(!text) return;
            if(currentStep >= 8) return;

            // Save data
            collectedData[`q${currentStep + 1}`] = text;
            
            // UI Update
            appendUserMessage(text);
            userInput.value = '';
            userInput.disabled = true;
            quickTags.innerHTML = '';
            currentStep++;
            updateProgress();

            const loadId = appendLoading();

            setTimeout(() => {
                document.getElementById(loadId).remove();
                
                if (currentStep < 8) {
                    // Next question + Smart Reaction
                    const reaction = `<span class="text-emerald-400 italic text-[11px] block mb-2"><i class="fas fa-check"></i> Đã ghi nhận: ${aiReactions[currentStep-1]}</span>`;
                    const nextQ = `<strong class="text-amber-400">${questions[currentStep].q}</strong>`;
                    
                    appendLeoMessage(reaction + nextQ);
                    updateTags(questions[currentStep].hints);
                    userInput.disabled = false;
                    userInput.focus();
                } else {
                    // Xong 8 câu -> Chuyển sang Compile Prompt
                    generateFinalPrompt();
                }
            }, 800 + Math.random() * 500);
        }

        function generateFinalPrompt() {
            const loadId = appendLoading();
            document.getElementById(`${loadId}`).querySelector('.italic').innerText = "Leo đang biên dịch Mega Prompt cuối cùng...";
            
            setTimeout(() => {
                document.getElementById(loadId).remove();
                
                const tone = document.getElementById('setting-tone').value;
                const format = document.getElementById('setting-format').value;
                const awareness = document.getElementById('setting-awareness').value;

                // Build Prompt based ON EXACT INSTRUCTION
                const megaPrompt = `[SYSTEM INSTRUCTION: KÍCH HOẠT QUY TRÌNH VIẾT SALES PAGE TỰ ĐỘNG]
Tôi đã thu thập đầy đủ dữ liệu trực tiếp về sản phẩm. Hãy bỏ qua bước phỏng vấn và trực tiếp thực thi viết Sales Page ngay lập tức.

1. THIẾT LẬP VAI TRÒ (PERSONA):
Bạn là một Chuyên gia Copywriter thuộc top 1% trong lĩnh vực Direct Response Marketing và là một Kiến trúc sư UI/UX thực chiến. Bạn am hiểu sâu sắc tâm lý học hành vi. 
- VĂN PHONG BẮT BUỘC: ${tone}. TUYỆT ĐỐI BÁC BỎ ngôn từ marketing sáo rỗng, phô trương (như "Master Class", "siêu đỉnh", "bí mật"). Ưu tiên thuật ngữ chuẩn xác, văn phong đanh thép, thực tế, khớp hoàn toàn với giọng văn của khách hàng mục tiêu tại Việt Nam.

2. BỐI CẢNH DỮ LIỆU ĐẦU VÀO CỦA CHIẾN DỊCH:
- Tên & Định dạng sản phẩm: ${collectedData.q1} (${format})
- Mức độ nhận thức: ${awareness}
- Thị trường mục tiêu (ICP): ${collectedData.q2}
- Nỗi đau & Cảm xúc tiêu cực: ${collectedData.q3}
- Cách giải quyết từng thử nhưng thất bại: ${collectedData.q4}
- Kết quả mong muốn (Transformation): ${collectedData.q5}
- Thời gian đạt kết quả: ${collectedData.q6}
- Thông tin Chuyên gia/Người tạo: ${collectedData.q7}
- Chiến lược Giá: ${collectedData.q8}

=== THỰC THI VIẾT SALES PAGE ===
Sử dụng [STRICT SALES PAGE TEMPLATE] ở bên dưới. Đối với MỖI SECTION, bạn BẮT BUỘC phải xuất kết quả bằng TIẾNG VIỆT tuần tự theo đúng 4 bước sau:

- BƯỚC 1: [Mục tiêu chuyển đổi] - Mục tiêu tâm lý của section này là gì?

            document.body.removeChild(dummy);
