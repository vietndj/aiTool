<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Strategy Copilot | Đa Ngành</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        
        .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05); }
        .chat-container { scroll-behavior: smooth; }
        
        /* Hiệu ứng Nút bấm & Cuộn */
        .chip { background: #f8fafc; border: 1px solid #cbd5e1; color: #475569; transition: all 0.2s ease; cursor: pointer; }
        .chip:hover { border-color: #3b82f6; color: #2563eb; background: #eff6ff; transform: translateY(-1px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Typing Indicator Sinh học */
        .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dots span { width: 6px; height: 6px; background-color: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden-section { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6">

    <div class="glass-panel w-full max-w-5xl h-screen md:h-[90vh] md:rounded-2xl flex flex-col overflow-hidden relative">
        
        <header class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-white z-10 shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center border border-blue-100">
                    <i class="fa-solid fa-layer-group text-blue-600 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold text-slate-800 tracking-tight">Content Strategist Copilot</h1>
                    <p class="text-xs md:text-sm text-slate-500 font-medium">Quy trình đóng gói kịch bản 3 module</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span class="text-xs font-semibold text-slate-500 hidden md:inline">Trợ lý trực tuyến</span>
            </div>
        </header>

        <div id="chat-screen" class="flex-1 flex flex-col bg-slate-50/50 overflow-hidden">
            <div id="chat-history" class="chat-container flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
                </div>
            
            <div class="bg-white border-t border-slate-200 p-4 md:p-5 shrink-0 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.02)]">
                <div id="quick-replies" class="flex flex-wrap gap-2 mb-3 hidden-section max-w-4xl mx-auto">
                    </div>
                
                <div class="flex gap-3 max-w-4xl mx-auto relative">
                    <input type="text" id="user-input" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-5 py-3.5 md:py-4 text-slate-800 text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all placeholder-slate-400" placeholder="Nhập câu trả lời của bạn..." onkeypress="handleEnter(event)">
                    <button onclick="processInput()" id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 md:px-8 py-3.5 md:py-4 rounded-xl transition-colors flex items-center gap-2">
                        <span class="hidden md:inline">Gửi</span> <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="prompt-screen" class="hidden-section flex-1 bg-white flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
                    <div>
                        <h2 class="font-bold text-slate-800 text-lg">Mega-Prompt đã sẵn sàng</h2>
                        <p class="text-sm text-slate-500">Copy toàn bộ lệnh dưới đây và đưa vào ChatGPT/Claude.</p>
                    </div>
                </div>
                <button onclick="resetApp()" class="text-sm text-blue-600 font-medium hover:underline">Thiết lập lại</button>
            </div>
            
            <div class="flex-1 p-6 relative bg-slate-800 m-6 rounded-xl border border-slate-700 shadow-inner flex flex-col">
                <textarea id="mega-prompt" class="flex-1 w-full bg-transparent text-slate-200 text-[15px] focus:outline-none resize-none font-mono leading-relaxed" readonly></textarea>
                <div class="absolute top-4 right-4">
                    <button id="copy-btn" onclick="copyPrompt()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                        <i class="fa-regular fa-copy"></i> Copy Lệnh
                    </button>
                </div>
            </div>
            
            <div class="px-6 pb-6 pt-0 shrink-0">
                <button onclick="copyAndOpenAI()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl w-full text-base transition-colors shadow-lg flex justify-center items-center gap-2">
                    COPY PROMPT & CHUYỂN SANG CHATGPT <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentStep = 0;
        let userData = { industry: "", framework: "", painPoint: "" };

        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const quickReplies = document.getElementById('quick-replies');
        const sendBtn = document.getElementById('send-btn');

        const industryOptions = [
            "📦 Bán lẻ / Sản phẩm vật lý",
            "🎓 Dịch vụ / Khóa học / Chuyên gia",
            "🎬 Xây kênh Viral / Giải trí"
        ];

        window.onload = () => {
            showTyping(1000, () => {
                addBotMessage(`Chào bạn, tôi là trợ lý lên chiến lược nội dung. Nhiệm vụ của tôi là giúp bạn thiết lập một quy trình sản xuất video ngắn (< 75 giây) được bóc tách làm 3 module: <strong>Hook linh hoạt - Body cố định - CTA linh hoạt</strong>.`);
                
                setTimeout(() => {
                    showTyping(1200, () => {
                        addBotMessage(`Để nội dung phần Body thực sự ra chuyển đổi, chúng ta cần ráp nó vào một Framework Marketing chuẩn xác. <br><br><strong>Hiện tại, bạn đang muốn làm nội dung cho lĩnh vực nào?</strong>`);
                        showOptions(industryOptions);
                    });
                }, 800);
            });
        };

        function handleEnter(e) { if (e.key === 'Enter') processInput(); }

        function showOptions(options) {
            quickReplies.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "chip px-4 py-2.5 text-sm font-medium rounded-full";
                btn.innerText = opt;
                btn.onclick = () => { userInput.value = opt; processInput(); };
                quickReplies.appendChild(btn);
            });
            quickReplies.classList.remove('hidden-section');
        }

        function showTyping(ms, callback) {
            userInput.disabled = true; sendBtn.disabled = true;
            quickReplies.classList.add('hidden-section');
            
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex items-start gap-3 md:gap-4 fade-in w-full md:w-4/5";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-slate-200 flex-shrink-0 flex items-center justify-center mt-1"><i class="fa-solid fa-robot text-slate-500 text-xs"></i></div>
                <div class="bg-white border border-slate-200 px-5 py-4 rounded-2xl rounded-tl-sm shadow-sm">
                    <div class="typing-dots"><span></span><span></span><span></span></div>
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            setTimeout(() => {
                document.getElementById(id).remove();
                userInput.disabled = false; sendBtn.disabled = false;
                callback();
                userInput.focus();
            }, ms);
        }

        function addBotMessage(text) {
            const div = document.createElement('div');
            div.className = "flex items-start gap-3 md:gap-4 fade-in w-full md:w-[85%]";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-100 flex-shrink-0 flex items-center justify-center border border-blue-200 mt-1">
                    <i class="fa-solid fa-robot text-blue-600 text-xs"></i>
                </div>
                <div class="bg-white border border-slate-200 px-5 md:px-6 py-4 rounded-2xl rounded-tl-sm shadow-sm text-[15px] md:text-base leading-relaxed text-slate-700">
                    ${text}
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function addUserMessage(text) {
            const div = document.createElement('div');
            div.className = "flex items-start gap-3 md:gap-4 flex-row-reverse fade-in w-full ml-auto md:w-[85%]";
            div.innerHTML = `
                <div class="bg-blue-600 text-white px-5 md:px-6 py-4 rounded-2xl rounded-tr-sm shadow-md text-[15px] md:text-base leading-relaxed">
                    ${text}
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function processInput() {
            const text = userInput.value.trim();
            if (!text) return;

            addUserMessage(text);
            userInput.value = '';
            quickReplies.classList.add('hidden-section');

            if (currentStep === 0) {
                userData.industry = text;
                currentStep++;
                
                showTyping(1800, () => {
                    const txt = text.toLowerCase();
                    let reason = "";
                    if (txt.includes("vật lý") || txt.includes("bán lẻ")) {
                        userData.framework = "PAS (Vấn đề - Kích động - Giải pháp)";
                        reason = "Sản phẩm vật lý thường giải quyết một nhu cầu cụ thể. Mô hình **PAS** (Chỉ ra vấn đề -> Xoáy sâu nỗi đau -> Đưa giải pháp) là lựa chọn tối ưu nhất để kích thích mua hàng.";
                    } else if (txt.includes("dịch vụ") || txt.includes("đào tạo") || txt.includes("chuyên gia")) {
                        userData.framework = "AIDA (Chú ý - Thích thú - Khao khát - Hành động)";
                        reason = "Bán dịch vụ và tri thức là bán niềm tin. Mô hình **AIDA** sẽ giúp tạo sự tin tưởng, khơi gợi khao khát từ từ trước khi chốt sale.";
                    } else {
                        userData.framework = "HRR (Hook - Retain - Reward)";
                        reason = "Với kênh giải trí/viral, tỷ lệ giữ chân là vua. Mô hình **HRR** (Tạo tò mò -> Giữ chân bằng nhịp điệu -> Thưởng kết quả ở cuối) sẽ được áp dụng.";
                    }

                    addBotMessage(`Đã phân loại. Với ngành hàng này, hệ thống sẽ sử dụng công thức Marketing xương sống là: <strong>${userData.framework}</strong>. ${reason}`);
                    
                    setTimeout(() => {
                        showTyping(1500, () => {
                            addBotMessage(`Để AI có thể thiết kế các phần mở đầu (Hook) thật sắc bén, bạn hãy mô tả 1 câu: <strong>Đâu là rào cản tâm lý, định kiến hoặc nỗi lo sợ lớn nhất khiến khách hàng chưa chịu mua sản phẩm/dịch vụ của bạn?</strong> <br><span class="text-sm text-slate-500">(VD: Sợ giá cao, sợ mỹ phẩm dị ứng, lười học...)</span>`);
                        });
                    }, 500);
                });
            } else if (currentStep === 1) {
                userData.painPoint = text;
                currentStep++;
                
                showTyping(2000, () => {
                    addBotMessage(`Dữ liệu Insight rất giá trị. Tôi đang đóng gói luồng tư duy này thành một Mega-Prompt cá nhân hóa. Chờ một chút...`);
                    setTimeout(() => generatePrompt(), 1500);
                });
            }
        }

        function generatePrompt() {
            document.getElementById('chat-screen').classList.add('hidden-section');
            document.getElementById('prompt-screen').classList.remove('hidden-section');
            document.getElementById('prompt-screen').classList.add('flex');
            
            const promptTemplate = `Hãy đóng vai trò là một Giám đốc Chiến lược Nội dung (Senior Content Strategist) và Copywriter thực chiến. Nhiệm vụ của bạn là đồng hành tư vấn 1-1 để giúp tôi tạo ra kịch bản video dọc (Tiktok/Reels) tối ưu chuyển đổi, thời lượng STRICTLY dưới 75 giây (tối đa 210 từ).

BỐI CẢNH DỰ ÁN CỦA TÔI:
- Ngành hàng / Sản phẩm: ${userData.industry}
- Rào cản / Nỗi đau lớn nhất của khách hàng: "${userData.painPoint}"
- Công thức Marketing xương sống: ${userData.framework}

CHIẾN LƯỢC SẢN XUẤT CÔNG NGHIỆP (3 MODULE):
Video sẽ được cấu trúc thành 3 phần tách biệt để tôi tối ưu thời gian quay dựng:
- Phần 1 (Hook - 15-20s): Thay đổi linh hoạt theo từng video để test A/B thị trường.
- Phần 2 (Body - 40s): LÕI CỐ ĐỊNH. Áp dụng chuẩn công thức [${userData.framework.split(' ')[0]}]. Phần này mang thông điệp chính, tôi SẼ CHỈ QUAY 1 LẦN để ghép vào giữa mọi video.
- Phần 3 (CTA - 10s): Thay đổi linh hoạt sao cho nối mượt với Hook.

QUY TẮC LÀM VIỆC CỦA BẠN (BẮT BUỘC):
1. KHÔNG BAO GIỜ tự ý nhả toàn bộ kịch bản ra trong 1 lần trả lời. Phải làm việc theo TỪNG BƯỚC HỎI ĐÁP bên dưới. Đợi tôi trả lời xong bước này mới được qua bước sau.
2. Ngôn ngữ giao tiếp điềm đạm, thực tế, đúng chất chuyên gia. Tuyệt đối không dùng những từ ngữ sáo rỗng, viễn tưởng.
3. Kịch bản xuất ra phải là "văn nói" tự nhiên, có nhịp điệu, động từ mạnh.

QUY TRÌNH THỰC HIỆN TỪNG BƯỚC:

BƯỚC 1 (Tạo Body cố định): Đặt cho tôi 1 hoặc 2 câu hỏi làm rõ về Ưu điểm nổi bật (USP) của sản phẩm tôi đang bán. Sau khi tôi cung cấp, hãy viết phần Lõi Body (khoảng 90-100 từ) áp dụng đúng cấu trúc ${userData.framework}. (Chờ tôi duyệt hoặc sửa).

BƯỚC 2 (Đề xuất Hook): Dựa vào Insight và Body đã chốt, hãy đưa ra 4 phương án Hook khác nhau (~40-50 từ/Hook). Phân loại rõ 4 hướng tiếp cận: (1) Đâm thẳng vào nỗi đau, (2) Lật ngược định kiến, (3) Bằng chứng thực tế, (4) Storytelling. (Yêu cầu tôi chọn 1 số).

BƯỚC 3 (Đề xuất CTA): Dựa vào Hook tôi đã chọn, đề xuất 3 câu CTA (~25 từ) nối mượt mà từ Body sang chốt sale. (Yêu cầu tôi chọn).

BƯỚC 4 (Lắp ráp & Tối ưu): Ghép [Hook] + [Body] + [CTA]. Chuốt lại các từ nối. BẮT BUỘC: Đếm chính xác tổng số từ, đảm bảo tuyệt đối dưới 210 từ.

Nếu bạn đã hiểu quy trình chuyên nghiệp này, hãy xác nhận ngắn gọn và bắt đầu ngay BƯỚC 1 bằng cách hỏi tôi về USP của sản phẩm!`;

            document.getElementById('mega-prompt').value = promptTemplate;
        }

        function copyPrompt() {
            const textArea = document.getElementById("mega-prompt");
            textArea.select();
            document.execCommand("copy");
            
            const btn = document.getElementById('copy-btn');
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã Copy Lệnh`;
            btn.classList.add('bg-emerald-600', 'text-white');
            btn.classList.remove('bg-slate-700');
            
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy Lệnh`;
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('bg-slate-700');
            }, 2500);
        }

        function copyAndOpenAI() {
            copyPrompt();
            window.open("https://chatgpt.com", "_blank");
        }

        function resetApp() {
            currentStep = 0;
            document.getElementById('prompt-screen').classList.add('hidden-section');
            document.getElementById('prompt-screen').classList.remove('flex');
            chatHistory.innerHTML = '';
            showTyping(500, () => {
                addBotMessage(`Hệ thống đã reset. Xin hỏi lại, bạn đang muốn làm nội dung cho lĩnh vực nào?`);
                showOptions(industryOptions);
            });
        }
    </script>
</body>
</html>
