<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kael - Hệ Thống Đóng Gói MVP & Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Be Vietnam Pro', sans-serif; 
            background-color: #020617; /* Deep Slate 950 */
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
            color: #f8fafc; 
            overflow-x: hidden; 
        }
        
        /* Font dùng riêng cho các block code/log để ra chất công nghệ */
        .font-tech { font-family: 'JetBrains Mono', monospace; }

        /* Hiệu ứng kính mờ không gian mạng (Cyber-Glass) */
        .glass-panel { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.15); 
            box-shadow: 0 0 40px -10px rgba(8, 145, 178, 0.15), inset 0 1px 0 rgba(255,255,255,0.05); 
        }
        
        .chat-container { scroll-behavior: smooth; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; box-shadow: 0 0 10px #06b6d4; }
        
        .pulse-glow { animation: pulseGlow 2s infinite alternate; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px rgba(6, 182, 212, 0.2); } 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.6); } }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Nút tương tác công nghệ */
        .chip-interactive { 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: #94a3b8; 
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); 
            cursor: pointer; 
        }
        .chip-interactive:hover { 
            border-color: #06b6d4; 
            color: #22d3ee; 
            background: rgba(6, 182, 212, 0.05); 
            transform: translateY(-2px); 
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.15); 
        }
        
        .hidden-section { display: none !important; }
        
        .typing-dots { display: flex; gap: 4px; padding: 4px 0; }
        .typing-dots span { width: 6px; height: 6px; background-color: #06b6d4; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); box-shadow: 0 0 0 transparent; } 40% { transform: scale(1); box-shadow: 0 0 8px #06b6d4; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-4">

    <div class="glass-panel w-full max-w-5xl h-screen md:h-[94vh] md:rounded-2xl flex flex-col overflow-hidden relative">
        
        <header class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50 z-10 shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-slate-950 rounded-xl flex items-center justify-center border border-cyan-500/30 pulse-glow">
                    <i class="fa-solid fa-layer-group text-cyan-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold text-slate-100 tracking-wide flex items-center gap-2">
                        KAEL SYSTEM
                        <span class="text-[10px] font-tech font-bold bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded border border-cyan-800">v3.0.MVP</span>
                    </h1>
                    <p class="text-[13px] text-slate-400 font-medium mt-0.5">Trợ Lý Phân Tích MVP & Đóng Gói Marketing</p>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 shadow-inner">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-cyan-500 rounded-full animate-pulse shadow-[0_0_8px_#06b6d4]"></span>
                    <span class="text-[11px] font-bold text-cyan-500 font-tech uppercase tracking-widest" id="engine-status">SYSTEM ONLINE</span>
                </div>
            </div>
        </header>

        <div class="bg-slate-900/80 border-b border-slate-800 px-6 py-4 shrink-0">
            <div class="flex items-center justify-between max-w-3xl mx-auto w-full relative">
                <div class="absolute inset-0 top-1/2 -translate-y-1/2 h-[2px] bg-slate-800 z-0"></div>
                <div id="step-progress-line" class="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-cyan-500 z-0 transition-all duration-700 shadow-[0_0_10px_#06b6d4]" style="width: 0%;"></div>
                
                <div class="z-10 flex flex-col items-center gap-2" id="step-node-0">
                    <div class="w-8 h-8 rounded-full bg-cyan-950 text-cyan-400 font-tech text-xs font-bold flex items-center justify-center border-2 border-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.4)] transition-all">1</div>
                    <span class="text-[10px] font-bold text-cyan-400 font-tech tracking-widest">LÕI MVP</span>
                </div>
                <div class="z-10 flex flex-col items-center gap-2" id="step-node-1">
                    <div class="w-8 h-8 rounded-full bg-slate-900 text-slate-600 font-tech text-xs font-bold flex items-center justify-center border-2 border-slate-800 transition-all">2</div>
                    <span class="text-[10px] font-bold text-slate-600 font-tech tracking-widest">INSIGHT</span>
                </div>
                <div class="z-10 flex flex-col items-center gap-2" id="step-node-2">
                    <div class="w-8 h-8 rounded-full bg-slate-900 text-slate-600 font-tech text-xs font-bold flex items-center justify-center border-2 border-slate-800 transition-all">3</div>
                    <span class="text-[10px] font-bold text-slate-600 font-tech tracking-widest">ĐỐI THỦ</span>
                </div>
                <div class="z-10 flex flex-col items-center gap-2" id="step-node-3">
                    <div class="w-8 h-8 rounded-full bg-slate-900 text-slate-600 font-tech text-xs font-bold flex items-center justify-center border-2 border-slate-800 transition-all">4</div>
                    <span class="text-[10px] font-bold text-slate-600 font-tech tracking-widest">PHỄU MKT</span>
                </div>
            </div>
        </div>

        <div id="chat-screen" class="flex-1 flex flex-col overflow-hidden bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9IiMzMzQxNTUiLz48L3N2Zz4=')]">
            <div id="chat-history" class="chat-container flex-1 overflow-y-auto p-4 md:p-8 space-y-6"></div>
            
            <div class="px-4 md:px-6 pt-2 shrink-0 bg-gradient-to-t from-slate-950 to-transparent">
                <div id="dynamic-chips-panel" class="max-w-4xl mx-auto flex flex-wrap gap-2 p-2 min-h-[48px] items-center transition-all">
                    </div>
            </div>

            <div class="bg-slate-950/80 border-t border-slate-800 p-4 md:p-5 shrink-0 backdrop-blur-md">
                <div class="flex gap-3 max-w-4xl mx-auto relative group">
                    <input type="text" id="user-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-5 py-4 text-slate-200 text-[15px] focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder-slate-600 shadow-inner" placeholder="Chọn chip gợi ý hoặc nhập dữ liệu của bạn..." onkeypress="handleEnter(event)">
                    <button onclick="processInput()" id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-6 py-4 rounded-xl transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)] shrink-0">
                        <span class="hidden md:inline uppercase tracking-wide text-sm">Truyền Dữ Liệu</span> <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="matrix-loader" class="hidden-section flex-1 bg-slate-950 flex flex-col items-center justify-center p-8 text-center">
            <div class="relative w-20 h-20 mb-8">
                <div class="absolute inset-0 border-2 border-slate-800 rounded-full"></div>
                <div class="absolute inset-0 border-2 border-cyan-400 rounded-full border-t-transparent animate-spin"></div>
                <div class="absolute inset-2 border-2 border-emerald-500 rounded-full border-b-transparent animate-spin-reverse" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
                <i class="fa-solid fa-microchip absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-cyan-400 text-xl animate-pulse"></i>
            </div>
            <h3 class="text-cyan-400 font-tech font-bold text-lg mb-4 tracking-[0.2em] shadow-cyan-400 drop-shadow-md">COMPILING MARKETING STRATEGY</h3>
            <div id="matrix-logs" class="text-[11px] font-tech text-emerald-400/80 max-w-md text-left bg-black p-5 rounded border border-slate-800 w-full h-36 overflow-hidden shadow-[inset_0_0_20px_rgba(0,0,0,1)]">
                </div>
        </div>

        <div id="prompt-screen" class="hidden-section flex-1 bg-slate-950 flex flex-col overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-800 flex justify-between items-center bg-slate-900 shrink-0">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-lg bg-emerald-950 border border-emerald-500/50 flex items-center justify-center text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.2)]">
                        <i class="fa-solid fa-check-double text-lg"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-100 text-base md:text-lg">Dữ Liệu Mega-Prompt Đã Đóng Gói</h2>
                        <p class="text-xs text-slate-400 font-tech mt-1">Sẵn sàng Deploy lên các nền tảng AI (ChatGPT/Claude)</p>
                    </div>
                </div>
                <button onclick="resetApp()" class="text-[13px] text-slate-400 hover:text-cyan-400 font-semibold flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700 transition-colors">
                    <i class="fa-solid fa-power-off"></i> Reboot System
                </button>
            </div>
            
            <div class="flex-1 p-4 md:p-6 relative bg-[#0a0f1c] m-4 md:m-6 rounded-xl border border-slate-800 flex flex-col shadow-[inset_0_0_30px_rgba(0,0,0,0.5)]">
                <textarea id="mega-prompt" class="flex-1 w-full bg-transparent text-cyan-50 font-tech text-[13px] focus:outline-none resize-none leading-relaxed" readonly></textarea>
                <div class="absolute top-4 right-4">
                    <button id="copy-btn" onclick="copyPrompt()" class="bg-slate-800 hover:bg-cyan-900 text-cyan-400 px-4 py-2.5 rounded-lg text-xs font-bold uppercase tracking-wide transition-colors flex items-center gap-2 border border-slate-700 shadow-lg">
                        <i class="fa-regular fa-copy"></i> Copy Mã Lệnh
                    </button>
                </div>
            </div>
            
            <div class="px-4 md:px-6 pb-4 md:pb-6 pt-0 shrink-0">
                <button onclick="copyAndOpenAI()" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-4.5 rounded-xl w-full text-sm md:text-base transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_25px_rgba(6,182,212,0.5)] flex justify-center items-center gap-2 uppercase tracking-widest">
                    Chuyển Tới ChatGPT & Nạp Lệnh <i class="fa-solid fa-rocket ml-1"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentStep = 0;
        let userData = { product: "", painPoint: "", competitorGap: "", upsellProduct: "" };

        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chipPanel = document.getElementById('dynamic-chips-panel');

        // Khung cấu hình Kael (Chuyên về MVP & Marketing)
        const stepConfigurations = [
            {
                question: "MODULE 1: BẠN ĐANG MUỐN ĐÓNG GÓI SẢN PHẨM MVP HOẶC DỊCH VỤ CỤ THỂ NÀO?",
                hint: "Sản phẩm MVP (Minimum Viable Product) là phiên bản làm thử để đo lường. Hãy gọi tên nó ngắn gọn.",
                chips: ["Mô hình Coaching/Đồng hành thực chiến", "Sản phẩm số/Template/Công cụ", "Dịch vụ tư vấn chuyên gia/Agency", "Sản phẩm vật lý thiết yếu ngách"]
            },
            {
                question: "MODULE 2: KHÁCH HÀNG CỦA BẠN ĐANG TỐN TIỀN/THỜI GIAN NHẤT Ở CÔNG ĐOẠN NÀO MÀ MVP NÀY GIẢI QUYẾT ĐƯỢC?",
                hint: "Đây là lõi Insight Marketing. Đừng nói về tính năng, hãy nói về sự chịu đựng của họ hiện tại.",
                chips: ["Quá bí ý tưởng, rào cản đứng trước camera", "Chi phí vận hành và thuê ngoài quá lớn", "Mua nhiều khóa học nhưng chỉ dạy lý thuyết", "Dùng các sản phẩm rẻ tiền nhưng mau hỏng"]
            },
            {
                question: "MODULE 3: KẼ HỞ/ĐIỂM YẾU CHÍẾT MẠNG CỦA CÁC ĐỐI THỦ HIỆN TẠI LÀ GÌ?",
                hint: "Tìm 'Vết nứt thị trường'. Đối thủ lớn thường bỏ qua điều gì? Đây sẽ là góc Content truyền thông tấn công.",
                chips: ["Đối thủ bán giá quá cao, khó tiếp cận", "Quy trình đối thủ quá cồng kềnh, khó dùng", "Họ bán xong là đem con bỏ chợ, không hỗ trợ", "Chỉ mạnh mảng branding, thiếu tính thực chiến"]
            },
            {
                question: "MODULE 4: HỆ SINH THÁI MARKETING SAU KHI BÁN MVP SẼ LÀ GÌ?",
                hint: "Bán MVP chỉ là phễu mồi. Bạn định Upsell sản phẩm/dịch vụ giá cao nào ở ngay phía sau?",
                chips: ["Gói dịch vụ Done-for-you (Làm hộ trọn gói)", "Thẻ thành viên Subscription trả phí hàng tháng", "Chương trình cố vấn Mentor 1-1 dài hạn", "Phân phối sỉ, mở đại lý bán lẻ"]
            }
        ];

        window.onload = () => {
            renderStep(0);
        };

        function handleEnter(e) { if (e.key === 'Enter') processInput(); }

        // TERMINAL LOG TƯ DUY THỜI GIAN THỰC (Giao diện Kael Tech)
        function showCognitiveThinking(logs, callback) {
            userInput.disabled = true;
            sendBtn.disabled = true;
            document.getElementById('engine-status').innerText = "DATA PROCESSING...";
            document.getElementById('engine-status').classList.add('text-emerald-400');
            document.getElementById('engine-status').classList.remove('text-cyan-500');
            
            const id = 'cognitive-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex items-start gap-4 fade-in w-full md:w-[85%]";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700 flex-shrink-0 flex items-center justify-center mt-1">
                    <i class="fa-solid fa-terminal text-emerald-400 text-sm"></i>
                </div>
                <div class="bg-black border border-slate-800 px-5 py-4 rounded-xl rounded-tl-sm shadow-[0_0_15px_rgba(0,0,0,0.5)] flex-1 text-emerald-400 font-tech text-[12px] space-y-1.5 leading-relaxed">
                    <div class="text-slate-500 border-b border-slate-800 pb-2 mb-2 flex justify-between items-center uppercase tracking-widest text-[10px]">
                        <span>[KAEL Terminal Active]</span>
                        <span class="w-2 h-2 rounded-sm bg-emerald-500 animate-pulse"></span>
                    </div>
                    <div id="${id}-log-area"></div>
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const logArea = document.getElementById(`${id}-log-area`);
            let logIndex = 0;

            function printLog() {
                if (logIndex < logs.length) {
                    const logLine = document.createElement('div');
                    logLine.className = "fade-in flex items-start gap-2";
                    logLine.innerHTML = `<span class="text-slate-600">></span> <span class="text-cyan-300">${logs[logIndex]}</span>`;
                    logArea.appendChild(logLine);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                    logIndex++;
                    setTimeout(printLog, 500);
                } else {
                    setTimeout(() => {
                        document.getElementById(id).remove();
                        document.getElementById('engine-status').innerText = "SYSTEM ONLINE";
                        document.getElementById('engine-status').classList.remove('text-emerald-400');
                        document.getElementById('engine-status').classList.add('text-cyan-500');
                        userInput.disabled = false;
                        sendBtn.disabled = false;
                        callback();
                    }, 700);
                }
            }
            printLog();
        }

        function renderStep(step) {
            if (step >= stepConfigurations.length) return;
            const config = stepConfigurations[step];
            
            // UI Bo mạch điện tử (Circuit Stepper)
            document.getElementById('step-progress-line').style.width = `${(step / (stepConfigurations.length - 1)) * 100}%`;
            for (let i = 0; i < stepConfigurations.length; i++) {
                const node = document.getElementById(`step-node-${i}`).querySelector('div');
                const text = document.getElementById(`step-node-${i}`).querySelector('span');
                if (i < step) {
                    node.className = "w-8 h-8 rounded-full bg-cyan-900 text-cyan-400 font-tech text-xs font-bold flex items-center justify-center border-2 border-cyan-500 shadow-[0_0_10px_rgba(6,182,212,0.4)] transition-all";
                    node.innerHTML = `<i class="fa-solid fa-check text-[11px]"></i>`;
                    text.className = "text-[10px] font-bold text-cyan-500 font-tech tracking-widest transition-all";
                } else if (i === step) {
                    node.className = "w-8 h-8 rounded-full bg-cyan-950 text-slate-100 font-tech text-xs font-bold flex items-center justify-center border-2 border-cyan-400 shadow-[0_0_15px_#06b6d4] scale-110 transition-all";
                    node.innerHTML = i + 1;
                    text.className = "text-[10px] font-bold text-cyan-400 font-tech tracking-widest transition-all drop-shadow-md";
                } else {
                    node.className = "w-8 h-8 rounded-full bg-slate-900 text-slate-600 font-tech text-xs font-bold flex items-center justify-center border-2 border-slate-800 transition-all";
                    node.innerHTML = i + 1;
                    text.className = "text-[10px] font-bold text-slate-600 font-tech tracking-widest transition-all";
                }
            }

            // Kael phát vấn
            const div = document.createElement('div');
            div.className = "flex items-start gap-4 fade-in w-full md:w-[90%]";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex-shrink-0 flex items-center justify-center mt-1 relative overflow-hidden">
                    <div class="absolute inset-0 bg-cyan-500/10"></div>
                    <i class="fa-solid fa-microchip text-cyan-400 text-sm"></i>
                </div>
                <div class="space-y-1.5 bg-slate-800/40 p-4 rounded-xl rounded-tl-sm border border-slate-700/50 backdrop-blur-sm">
                    <div class="text-[11px] font-tech text-cyan-500 font-bold tracking-widest uppercase flex items-center gap-2">
                        <i class="fa-solid fa-circle text-[6px] animate-pulse"></i> KAEL REQUEST
                    </div>
                    <div class="font-bold text-slate-200 text-[15px] tracking-wide leading-relaxed">${config.question}</div>
                    <div class="text-[13px] text-slate-400 font-medium pt-1 italic border-l-2 border-slate-600 pl-3 mt-2"> ${config.hint}</div>
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // Render Tech Chips
            chipPanel.innerHTML = '';
            config.chips.forEach(chipText => {
                const button = document.createElement('button');
                button.className = "chip-interactive px-4 py-2 text-[13px] font-semibold rounded-lg shadow-sm font-sans flex items-center gap-2";
                button.innerHTML = `<i class="fa-solid fa-code text-[10px] opacity-50"></i> ${chipText}`;
                button.onclick = () => {
                    if (userInput.value) {
                        userInput.value += ", " + chipText;
                    } else {
                        userInput.value = chipText;
                    }
                    userInput.focus();
                };
                chipPanel.appendChild(button);
            });
            userInput.focus();
        }

        // Hộp lưu trữ Data (Data Nodes)
        function renderStructuredBlock(title, dataSummary) {
            const div = document.createElement('div');
            div.className = "flex flex-col p-4 bg-slate-900/80 border border-cyan-900/50 rounded-xl max-w-4xl mx-auto my-3 fade-in shadow-[inset_0_0_20px_rgba(6,182,212,0.05)]";
            div.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2">
                    <span class="text-[11px] font-tech font-bold text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-database mr-1 text-cyan-500"></i> LƯU TRỮ DỮ LIỆU LÕI</span>
                    <span class="text-[10px] font-tech text-cyan-400 bg-cyan-950 border border-cyan-800 px-2 py-0.5 rounded font-bold">${title}</span>
                </div>
                <div class="text-[14px] text-slate-300 leading-relaxed font-medium pl-1 border-l-2 border-cyan-500/30 pl-3">${dataSummary}</div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function getSummarySnippet(input) {
            const words = input.trim().split(/\s+/);
            if (words.length <= 5) return words.join(" ");
            return words.slice(0, 5).join(" ") + "...";
        }

        function processInput() {
            const text = userInput.value.trim();
            if (!text) return;

            // User Chat Bubble (Cyan Theme)
            const div = document.createElement('div');
            div.className = "flex items-start gap-4 flex-row-reverse fade-in w-full ml-auto md:w-[85%]";
            div.innerHTML = `
                <div class="bg-cyan-600/20 border border-cyan-500/50 text-cyan-50 px-5 py-4 rounded-xl rounded-tr-sm shadow-[0_0_15px_rgba(6,182,212,0.15)] text-[15px] leading-relaxed max-w-[85%] backdrop-blur-sm">
                    ${text}
                </div>
            `;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            userInput.value = '';
            chipPanel.innerHTML = '';

            // Xử lý các luồng của Kael
            if (currentStep === 0) {
                userData.product = text;
                renderStructuredBlock("MVP LÕI", text);
                currentStep++;
                showCognitiveThinking([
                    `Parsing MVP Parameters: [${getSummarySnippet(text)}]`,
                    "Checking market validation matrix...",
                    "MVP Core indexed successfully."
                ], () => renderStep(currentStep));
            } 
            else if (currentStep === 1) {
                userData.painPoint = text;
                renderStructuredBlock("INSIGHT", text);
                currentStep++;
                showCognitiveThinking([
                    `Extracting Behavioral Pain points: [${getSummarySnippet(text)}]`,
                    "Mapping emotional triggers for Marketing Hook...",
                    "Insight vectors saved to database."
                ], () => renderStep(currentStep));
            } 
            else if (currentStep === 2) {
                userData.competitorGap = text;
                renderStructuredBlock("KẼ HỞ", text);
                currentStep++;
                showCognitiveThinking([
                    `Scanning Market Gaps: [${getSummarySnippet(text)}]`,
                    "Analyzing competitor blind spots...",
                    "Positioning strategy calculation complete."
                ], () => renderStep(currentStep));
            } 
            else if (currentStep === 3) {
                userData.upsellProduct = text;
                renderStructuredBlock("PHỄU MARKETING", text);
                currentStep++;
                
                // Final Matrix Loading Screen
                document.getElementById('chat-screen').classList.add('hidden-section');
                document.getElementById('matrix-loader').classList.remove('hidden-section');
                document.getElementById('engine-status').innerText = "COMPILING MATRIX";
                
                const matrixLogs = document.getElementById('matrix-logs');
                const logSteps = [
                    "INITIATING KAEL CORE ALGORITHMS...",
                    "STRUCTURING ASCII VISUAL MINDMAP...",
                    "ASSEMBLING MARKETING PACKAGING MODULES...",
                    "GENERATING CAPITALIZED DATA SCHEMAS...",
                    "WRITING CONTENT ANGLES & HOOK TRIGGERS...",
                    "ENCRYPTING MEGA-PROMPT FOR DEPLOYMENT...",
                    "ALL SYSTEMS GREEN. READY FOR EXPORT."
                ];
                
                let i = 0;
                function runMatrixLog() {
                    if (i < logSteps.length) {
                        const d = document.createElement('div');
                        d.className = "mb-1.5 opacity-90";
                        d.innerHTML = `<span class="text-slate-600">[${new Date().toLocaleTimeString()}]</span> > ${logSteps[i]}`;
                        matrixLogs.appendChild(d);
                        i++;
                        matrixLogs.scrollTop = matrixLogs.scrollHeight;
                        setTimeout(runMatrixLog, 350);
                    } else {
                        setTimeout(() => {
                            document.getElementById('matrix-loader').classList.add('hidden-section');
                            document.getElementById('engine-status').innerText = "STANDBY";
                            generatePrompt();
                        }, 800);
                    }
                }
                runMatrixLog();
            }
        }

        function generatePrompt() {
            document.getElementById('prompt-screen').classList.remove('hidden-section');
            document.getElementById('prompt-screen').classList.add('flex');
            
            const promptTemplate = `Bạn là Kael, một AI chuyên gia kiến trúc dữ liệu và cố vấn đóng gói sản phẩm Marketing xuất sắc. Nhiệm vụ của bạn là tiếp nhận tập dữ liệu phỏng vấn thô về MVP của tôi để phân tích chuyên sâu, đóng gói lại và tạo ra bức tranh chiến lược kinh doanh, định vị truyền thông hoàn chỉnh.

[DỮ LIỆU ĐẦU VÀO TỪ KAEL SYSTEM]:
- Sản phẩm MVP Lõi: ${userData.product}
- Nỗi đau hành vi khách hàng: ${userData.painPoint}
- Điểm mù của đối thủ: ${userData.competitorGap}
- Phễu sản phẩm Upsell Marketing: ${userData.upsellProduct}

[QUY TRÌNH EXPORT DỮ LIỆU - YÊU CẦU TUÂN THỦ 100% CẤU TRÚC SAU]:

1. BƯỚC 1 - VẼ ASCII MINDMAP:
Xuất ngay một sơ đồ tư duy bằng ký tự ASCII trực quan để mô tả hệ sinh thái sản phẩm và định vị (Sử dụng các ký tự nét liền ───, │, └───).

2. BƯỚC 2 - ĐÓNG GÓI CÁC BẢNG MATRIX MARKETING (TIÊU ĐỀ IN HOA TOÀN BỘ):

# BẢNG 1: ĐỊNH VỊ MVP VÀ THỊ TRƯỜNG NGÁCH
- Phân tích bản chất giải pháp MVP và điểm độc bản (USP) để truyền thông.
- Chỉ ra phân khúc khách hàng mục tiêu sẵn sàng xuống tiền ngay.

# BẢNG 2: BẢN ĐỒ ĐỐI THỦ & CHIẾN LƯỢC TẤN CÔNG KHÔNG GIAN TRỐNG
- Phân tích kẽ hở/lỗ hổng vận hành của đối thủ.
- Đưa ra chiến lược định vị truyền thông đánh trực diện vào điểm yếu này để kéo traffic.

# BẢNG 3: BỘ TỪ KHÓA TÂM LÝ (PSYCHOLOGICAL TRIGGERS)
- Bóc tách nỗi sợ hãi thầm kín và rào cản mua hàng dựa trên Insight.
- Cung cấp bộ 10 từ khóa "thôi miên" nên dùng trên Video/Landing Page để tăng tỷ lệ chuyển đổi.

# BẢNG 4: HỆ SINH THÁI PHỄU MARKETING & DÒNG TIỀN
- Cấu trúc hóa mô hình: Quà tặng (Lead Magnet) -> Sản phẩm MVP -> Sản phẩm Upsell cao cấp.
- Giải thích tính liền mạch của dòng tiền trong phễu này.

# BỘ TÀI NGUYÊN CONTENT: 5 KỊCH BẢN VIDEO NGẮN MỞ PHỄU
- Đóng gói 5 ý tưởng định hướng nội dung video (TikTok/Reels) đánh mạnh vào nỗi đau hành vi thực tế, tích hợp CTA khéo léo để kéo khách về phễu MVP.

3. BƯỚC 3 - KHỞI TẠO VÒNG LẶP (LOOP):
Sau khi xuất xong, đặt câu hỏi chính xác như sau: "Dữ liệu Marketing đã được Kael đóng gói. Bạn muốn tôi làm rõ thêm, viết chi tiết kịch bản video nào, hay điều chỉnh sơ đồ ASCII phía trên để chuẩn xác nhất?".`;

            document.getElementById('mega-prompt').value = promptTemplate;
        }

        function copyPrompt() {
            const textArea = document.getElementById("mega-prompt");
            textArea.select();
            document.execCommand("copy");
            
            const btn = document.getElementById('copy-btn');
            btn.innerHTML = `<i class="fa-solid fa-check text-cyan-300"></i> Đã Copy Lệnh Đóng Gói`;
            btn.classList.add('bg-cyan-900', 'text-cyan-300', 'border-cyan-500');
            btn.classList.remove('bg-slate-800', 'text-cyan-400', 'border-slate-700');
            
            setTimeout(() => {
                btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy Mã Lệnh`;
                btn.classList.remove('bg-cyan-900', 'text-cyan-300', 'border-cyan-500');
                btn.classList.add('bg-slate-800', 'text-cyan-400', 'border-slate-700');
            }, 3000);
        }

        function copyAndOpenAI() {
            copyPrompt();
            window.open("https://chatgpt.com", "_blank");
        }

        function resetApp() {
            currentStep = 0;
            userData = { product: "", painPoint: "", competitorGap: "", upsellProduct: "" };
            
            document.getElementById('prompt-screen').classList.add('hidden-section');
            document.getElementById('prompt-screen').classList.remove('flex');
            document.getElementById('matrix-loader').classList.add('hidden-section');
            document.getElementById('chat-screen').classList.remove('hidden-section');
            
            chatHistory.innerHTML = '';
            document.getElementById('matrix-logs').innerHTML = '';
            
            document.getElementById('engine-status').innerText = "SYSTEM ONLINE";
            
            renderStep(0);
        }
    </script>
</body>
</html>
