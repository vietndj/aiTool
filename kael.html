<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Strategist | Private AI Node</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-panel { background: #0f172a; border: 1px solid #1e293b; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Markdown Styles */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body strong { color: #38bdf8; font-weight: 600; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9em; }
        .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 12px; text-align: left; }
        .markdown-body th { background-color: #1e293b; color: #38bdf8; }
        
        /* Typing animation */
        .typing span { width: 6px; height: 6px; background: #38bdf8; border-radius: 50%; display: inline-block; margin: 0 2px; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .hidden-el { display: none !important; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 md:p-6">

    <div id="setup-screen" class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl z-20">
        <div class="text-center mb-8">
            <i class="fa-solid fa-microchip text-4xl text-sky-400 mb-4"></i>
            <h1 class="text-2xl font-bold">SYSTEM BOOT</h1>
            <p class="text-sm text-slate-400 mt-1">Vui lòng cấp quyền Google AI Studio API</p>
        </div>
        <input type="password" id="api-key" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-5 py-4 mb-6 text-white focus:outline-none focus:border-sky-500" placeholder="Nhập API Key (AIzaSy...)">
        <button onclick="initSystem()" class="w-full bg-sky-600 hover:bg-sky-500 font-bold py-4 rounded-xl transition-colors">
            KẾT NỐI MÁY CHỦ
        </button>
    </div>

    <div id="chat-screen" class="hidden-el glass-panel w-full max-w-5xl h-screen md:h-[90vh] md:rounded-2xl flex-col shadow-2xl overflow-hidden">
        
        <header class="px-6 py-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full border border-sky-500 flex items-center justify-center font-bold text-sky-400 bg-slate-800" id="ai-avatar">AI</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">C-Level: <span id="header-name" class="text-sky-400"></span></h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <p class="text-xs text-slate-400">Gemini 1.5 AI Node</p>
                    </div>
                </div>
            </div>
            <button onclick="location.reload()" class="text-sm text-slate-400 hover:text-white px-3 py-1.5 rounded border border-slate-700">Ngắt kết nối</button>
        </header>

        <div id="chat-history" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6"></div>

        <div class="p-4 bg-slate-900 border-t border-slate-800 shrink-0">
            <div class="flex gap-3 max-w-4xl mx-auto relative">
                <input type="text" id="user-input" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-sky-500 placeholder-slate-500" placeholder="Nhập câu trả lời hoặc phím số (1, 2, 3)..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()" id="send-btn" class="bg-sky-600 hover:bg-sky-500 px-8 rounded-xl font-bold transition-colors"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const names = ["Atlas", "Leon", "Kael", "Silas", "Orion"];
        const aiName = names[Math.floor(Math.random() * names.length)];
        let apiKey = "";
        let chatContext = [];

        document.getElementById('header-name').innerText = aiName;
        document.getElementById('ai-avatar').innerText = aiName[0];

        // MASTER PROMPT NẠP VÀO SYSTEM INSTRUCTION
        const systemInstruction = `Đóng vai trò là Giám đốc Chiến lược Cấp cao. Tên của bạn là ${aiName}. Nhiệm vụ của bạn là cố vấn 1-1 để giúp tôi thiết kế chuỗi sản phẩm.
QUY TẮC:
1. TUYỆT ĐỐI KHÔNG xuất ra toàn bộ kịch bản trong 1 lần. Tương tác TỪNG BƯỚC.
2. KHÔNG ĐƯỢC bắt tôi tự suy nghĩ. Ở mỗi bước, BẠN TỰ ĐƯA RA 4 GỢI Ý ĐÁNH SỐ (1, 2, 3, 4) sâu sắc nhất để tôi chọn.
3. Ngôn ngữ: Điềm đạm, xưng "Tôi" và "Bạn".

PHẦN 1: KHỞI ĐỘNG
Chào tôi bằng tên của bạn. Giải thích ngắn gọn 3 Lộ trình Chiến lược dưới đây (kèm ví dụ) và yêu cầu tôi chọn bằng cách gõ số 1, 2, hoặc 3:
- [1] Lộ trình "VẾT THƯƠNG NGẦM": Tìm nỗi đau tâm lý sâu kín nhất thiết kế phễu chữa lành.
- [2] Lộ trình "KẺ THÁCH THỨC": Khai thác điểm mù Đối thủ lớn tạo sản phẩm cướp khách.
- [3] Lộ trình "NHIỆM VỤ NGẦM" (Jobs-To-Be-Done): Bỏ qua tính năng, tập trung vào "Sự thay đổi vị thế".
(DỪNG LẠI và chờ tôi gõ số lựa chọn).

PHẦN 2: THỰC THI (Chỉ kích hoạt lộ trình tôi đã chọn)
NẾU TÔI CHỌN [1]:
- B1.1: Hỏi tôi đang bán sản phẩm gì. (Chờ).
- B1.2: Đưa 4 gợi ý đánh số về Nhóm khách ngách kèm Nỗi đau tột cùng. (Chờ tôi chọn).
- B1.3: Đưa 4 gợi ý đánh số về Rào cản/Hoài nghi. (Chờ tôi chọn).
- B1.4: Đề xuất Chuỗi sản phẩm phễu (Mồi câu -> Lõi -> Upsell).

NẾU TÔI CHỌN [2]:
- B2.1: Hỏi sản phẩm và Đối thủ tôi ghét nhất. (Chờ).
- B2.2: Đưa 4 gợi ý đánh số về "Cục tức/Lỗ hổng" khách đang chịu đựng. (Chờ chọn).
- B2.3: Vẽ tâm lý khách bất mãn. Đưa 4 gợi ý thông điệp "Vị Cứu Tinh". (Chờ chọn).
- B2.4: Đề xuất Chuỗi sản phẩm "Cướp khách".

NẾU TÔI CHỌN [3]:
- B3.1: Hỏi tôi đang bán sản phẩm gì. (Chờ).
- B3.2: Đưa 4 gợi ý đánh số về "Sự thay đổi/Động lực ngầm" khách khao khát. (Chờ chọn).
- B3.3: Chỉ ra 4 Sản phẩm thay thế (không cùng ngành) khách đang dùng. (Chờ chọn).
- B3.4: Đề xuất chuỗi Giá trị gia tăng để tránh đua giá.`;

        function initSystem() {
            const key = document.getElementById('api-key').value.trim();
            if(!key) return alert("Vui lòng nhập API Key!");
            apiKey = key;
            
            document.getElementById('setup-screen').classList.add('hidden-el');
            document.getElementById('chat-screen').classList.remove('hidden-el');
            document.getElementById('chat-screen').classList.add('flex');
            
            // Kích hoạt AI tự động chào hỏi bằng 1 trigger ẩn
            callGeminiAPI("Hệ thống đã kết nối. Hãy bắt đầu Phần 1.", true);
        }

        async function callGeminiAPI(text, isHiddenInit = false) {
            const input = document.getElementById('user-input');
            const btn = document.getElementById('send-btn');
            
            if (!isHiddenInit) {
                appendMessage('user', text);
            }
            
            chatContext.push({ role: "user", parts: [{ text: text }] });
            
            input.disabled = true; btn.disabled = true;
            input.value = '';
            
            const loadingId = appendTyping();

            try {
                // Sử dụng v1beta để hỗ trợ systemInstruction
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        contents: chatContext
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.error) throw new Error(data.error.message);

                const botReply = data.candidates[0].content.parts[0].text;
                chatContext.push({ role: "model", parts: [{ text: botReply }] });
                appendMessage('bot', botReply);

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('system', `<span class="text-rose-400">Lỗi kết nối: ${error.message}</span>`);
                chatContext.pop(); // Remove failed message from history
            }

            input.disabled = false; btn.disabled = false;
            if(!isHiddenInit) input.focus();
        }

        function sendMessage() {
            const text = document.getElementById('user-input').value.trim();
            if(text) callGeminiAPI(text);
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-history');
            const div = document.createElement('div');
            
            if (sender === 'user') {
                div.className = "flex justify-end mb-6";
                div.innerHTML = `<div class="bg-sky-600 text-white px-5 py-3 rounded-2xl rounded-tr-sm max-w-[85%] text-[15px] shadow-lg">${text}</div>`;
            } else if (sender === 'bot') {
                div.className = "flex gap-4 mb-6";
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full border border-sky-500 bg-slate-800 flex items-center justify-center font-bold text-sky-400 text-sm shrink-0 shadow-lg">${aiName[0]}</div>
                    <div class="bg-slate-800 border border-slate-700 px-6 py-5 rounded-2xl rounded-tl-sm w-full max-w-[85%] text-[15px] text-slate-200 markdown-body shadow-lg leading-relaxed">${marked.parse(text)}</div>
                `;
            } else {
                div.className = "text-center mb-6 text-sm";
                div.innerHTML = text;
            }
            
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function appendTyping() {
            const id = 'type-' + Date.now();
            const box = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex gap-4 mb-6";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full border border-slate-600 bg-slate-800 flex items-center justify-center font-bold text-slate-500 text-sm shrink-0">${aiName[0]}</div>
                <div class="bg-slate-800 border border-slate-700 px-6 py-4 rounded-2xl rounded-tl-sm flex items-center shadow-lg"><div class="typing"><span></span><span></span><span></span></div></div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
